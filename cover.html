<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>筱風｜翻唱</title>
<link rel="icon" type="image/png" href="Profile%20Pitcure/ItzSeirProfile.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  
<style>
:root{
  --bg:#eef4f7;
  --bg2:#e3edf2;
  --surface:#ffffff;
  --surface-soft:rgba(255,255,255,.76);
  --surface-glass:rgba(255,255,255,.84);
  --line:rgba(25,42,58,.10);
  --line-strong:rgba(25,42,58,.16);
  --text:#163042;
  --heading:#122c3c;
  --muted:#6a7d89;
  --muted2:#9aabb6;
  --sea:#0f4c5c;
  --teal:#2a9d8f;
  --ice:#7bdff2;
  --warm:#f4a261;
  --danger:#d62828;
  --shadow:0 18px 50px rgba(31,53,72,.12);
  --shadow-soft:0 10px 30px rgba(31,53,72,.08);
  --radius:28px;
  --radius2:20px;
  --max:1240px;
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html,body{ width:100%; max-width:100%; overflow-x:hidden; }

body{
  margin:0;
  min-height:100vh;
  font-family:"Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% -10%, rgba(42,157,143,.18), transparent 34%),
    radial-gradient(circle at 88% 6%, rgba(123,223,242,.18), transparent 30%),
    linear-gradient(180deg, #f7fbfc 0%, var(--bg) 48%, #ffffff 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(15,76,92,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,76,92,.05) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.72), transparent 76%);
  z-index:-1;
}

a{ color:inherit; }
button,input{ font:inherit; }
button{ -webkit-tap-highlight-color:transparent; }

.page{
  width:min(var(--max), calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 54px;
}

.topbar{
  position:sticky;
  top:12px;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(31,53,72,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  text-decoration:none;
}

.brandMark{
  width:36px;
  height:36px;
  flex:0 0 auto;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(135deg, var(--sea), var(--teal));
  box-shadow:0 10px 22px rgba(15,76,92,.22);
}

.brandMark img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.brandText{
  display:flex;
  flex-direction:column;
  min-width:0;
  line-height:1.1;
}

.brandText strong{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brandText span{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.navPills{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

.navPills a{
  text-decoration:none;
  color:#264052;
  font-size:12px;
  font-weight:900;
  padding:9px 12px;
  border-radius:999px;
  transition:.18s ease;
}

.navPills a:hover,
.navPills a.active{
  color:var(--sea);
  background:linear-gradient(135deg, rgba(15,76,92,.10), rgba(42,157,143,.12));
}

.hero{
  display:grid;
  grid-template-columns:minmax(0, 1.08fr) minmax(320px, .92fr);
  gap:22px;
  align-items:stretch;
  margin-bottom:22px;
}

.heroCard,
.statsPanel{
  border:1px solid var(--line);
  border-radius:32px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.heroCard{
  position:relative;
  min-height:320px;
  padding:34px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.98), rgba(236,245,246,.90)),
    radial-gradient(circle at 86% 14%, rgba(42,157,143,.15), transparent 34%);
}

.heroCard::after{
  content:"";
  position:absolute;
  right:-120px;
  bottom:-150px;
  width:340px;
  height:340px;
  border-radius:50%;
  border:42px solid rgba(15,76,92,.075);
  pointer-events:none;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  width:max-content;
  max-width:100%;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(15,76,92,.14);
  color:var(--sea);
  background:rgba(15,76,92,.08);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.dot{
  width:9px;
  height:9px;
  border-radius:999px;
  display:inline-block;
  background:var(--teal);
  flex:0 0 auto;
}

.pillDot{
  width:5px;
  height:5px;
  border-radius:999px;
  background:#c97920;
  box-shadow:0 0 0 4px rgba(244,162,97,.13);
  flex:0 0 auto;
}

.miniPill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  width:max-content;
  max-width:100%;
  padding:7px 12px;
  border-radius:999px;
  color:#9a5a12;
  background:linear-gradient(135deg, rgba(244,162,97,.18), rgba(255,239,221,.92));
  border:1px solid rgba(244,162,97,.22);
  box-shadow:0 8px 18px rgba(244,162,97,.10);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.heroTitle{
  position:relative;
  z-index:1;
  margin:24px 0 18px;
  font-size:clamp(40px, 5vw, 68px);
  line-height:1.12;
  letter-spacing:-.045em;
  font-weight:900;
  color:var(--heading);
}

.heroTitle span{
  display:block;
  color:transparent;
  background:linear-gradient(135deg, var(--sea), var(--teal));
  -webkit-background-clip:text;
  background-clip:text;
}

.heroDesc{
  position:relative;
  z-index:1;
  max-width:720px;
  margin:0;
  color:#5e717d;
  line-height:1.85;
  font-size:14px;
  font-weight:650;
}

.heroActions{
  position:relative;
  z-index:1;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:26px;
}

.actionBtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0 16px;
  border:0;
  border-radius:999px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg, var(--sea), var(--teal));
  box-shadow:0 14px 28px rgba(15,76,92,.20);
  transition:transform .16s ease, box-shadow .16s ease;
}

.actionBtn:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 34px rgba(15,76,92,.24);
}

.ghostBtn{
  color:#1d3a4a;
  background:#fff;
  border:1px solid var(--line-strong);
  box-shadow:0 10px 22px rgba(31,53,72,.07);
}

.statsPanel{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.albumVisual{
  position:relative;
  min-height:176px;
  border-radius:26px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 30% 26%, rgba(123,223,242,.35), transparent 30%),
    radial-gradient(circle at 76% 72%, rgba(42,157,143,.24), transparent 36%),
    linear-gradient(135deg, rgba(15,76,92,.16), rgba(42,157,143,.10));
  overflow:hidden;
}

.albumVisual::before{
  content:"♪";
  position:absolute;
  right:28px;
  bottom:-14px;
  color:rgba(15,76,92,.13);
  font-size:144px;
  line-height:1;
  font-weight:900;
}

.albumVisual::after{
  content:"Cover";
  position:absolute;
  left:18px;
  bottom:16px;
  color:var(--heading);
  font-size:26px;
  font-weight:900;
  letter-spacing:-.04em;
}

.statsTitle{
  margin:0;
  color:var(--heading);
  font-size:22px;
  line-height:1.2;
  letter-spacing:-.035em;
  font-weight:900;
}

.statsText{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.75;
  font-weight:650;
}

.statGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:auto;
}

.statBox{
  min-height:82px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
}

.statNum{
  color:var(--heading);
  font-size:24px;
  font-weight:900;
  line-height:1;
  letter-spacing:-.04em;
}

.statLabel{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}

.appSection{
  border:1px solid var(--line);
  border-radius:32px;
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.sectionHead{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  padding:24px 24px 16px;
  border-bottom:1px solid var(--line);
  background:
    linear-gradient(135deg, rgba(15,76,92,.06), rgba(42,157,143,.05)),
    rgba(255,255,255,.58);
}

.sectionKicker{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--sea);
  font-size:12px;
  font-weight:900;
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.sectionTitle{
  margin:0;
  color:var(--heading);
  font-size:clamp(24px, 3vw, 38px);
  line-height:1.18;
  letter-spacing:-.035em;
  font-weight:900;
}

.sectionDesc{
  margin:8px 0 0;
  max-width:760px;
  color:var(--muted);
  font-size:13px;
  line-height:1.75;
  font-weight:650;
}

.app{
  display:grid;
  grid-template-columns:320px minmax(0, 1fr);
  gap:18px;
  padding:20px;
  align-items:start;
  width:100%;
}

.card{
  min-width:0;
  border:1px solid var(--line);
  border-radius:26px;
  background:rgba(255,255,255,.84);
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}

.sidebar{
  padding:16px;
}

.side-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--heading);
  font-size:15px;
  font-weight:900;
  margin-bottom:12px;
}

.search{
  width:100%;
  min-height:42px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  color:var(--heading);
  font-size:13px;
  font-weight:750;
  outline:none;
  background:#fff;
  box-shadow:0 8px 18px rgba(31,53,72,.05);
}

.search:focus{
  border-color:rgba(15,76,92,.28);
  box-shadow:0 0 0 4px rgba(15,76,92,.08);
}

.song-list{
  display:grid;
  gap:10px;
  margin-top:12px;
  max-height:590px;
  overflow-y:auto;
  padding-right:4px;
  min-width:0;
  overscroll-behavior:contain;
}

.song-list::-webkit-scrollbar{ width:10px; }
.song-list::-webkit-scrollbar-thumb{ background:rgba(15,76,92,.20); border-radius:999px; border:3px solid rgba(255,255,255,.8); }
.song-list::-webkit-scrollbar-track{ background:transparent; }

.song-item{
  min-width:0;
  min-height:58px;
  padding:12px 13px;
  border-radius:18px;
  border:1px solid var(--line);
  cursor:pointer;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  transition:transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
}

.song-item:hover{
  transform:translateY(-1px);
  border-color:rgba(15,76,92,.22);
  box-shadow:0 10px 22px rgba(31,53,72,.08);
}

.song-item.active{
  background:linear-gradient(135deg, rgba(15,76,92,.08), rgba(42,157,143,.07));
  border-color:rgba(15,76,92,.22);
}

.song-item span{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--heading);
  font-size:13px;
  font-weight:900;
}

.song-item small{
  flex:0 0 auto;
  font-size:11px;
  color:var(--muted);
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.main{
  padding:18px;
  min-width:0;
}

.playerShell{
  width:100%;
  min-width:0;
  display:grid;
  gap:14px;
}

.player,
.lyricsCard{
  min-width:0;
  padding:18px;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.90);
  box-shadow:0 8px 20px rgba(31,53,72,.06);
}

.playerHead{
  display:grid;
  gap:14px;
}

.headRow{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.trackInfo{
  min-width:0;
  flex:1 1 auto;
}

.trackTop{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  flex-wrap:wrap;
}

.trackTitle{
  color:var(--heading);
  font-size:24px;
  line-height:1.14;
  letter-spacing:-.035em;
  font-weight:900;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.trackDesc{
  margin-top:7px;
  color:var(--muted);
  font-weight:800;
  font-size:13px;
  line-height:1.55;
}

.metaPills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:34px;
  padding:0 11px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:#fff;
  color:#244150;
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
}

.pill .dot{
  width:8px;
  height:8px;
  border-radius:999px;
  background:var(--teal);
  flex:0 0 auto;
}

.wave{
  display:inline-flex;
  align-items:flex-end;
  gap:3px;
  height:30px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid rgba(15,76,92,.14);
  background:rgba(15,76,92,.08);
}

.wave i{
  display:block;
  width:3px;
  height:6px;
  border-radius:999px;
  background:rgba(15,76,92,.75);
  transform-origin:bottom;
  animation:wave 900ms ease-in-out infinite;
  animation-play-state:paused;
}

.wave i:nth-child(1){ animation-delay:0ms; }
.wave i:nth-child(2){ animation-delay:120ms; }
.wave i:nth-child(3){ animation-delay:240ms; }
.wave i:nth-child(4){ animation-delay:360ms; }
.wave i:nth-child(5){ animation-delay:480ms; }

@keyframes wave{
  0%{ transform:scaleY(.35); opacity:.55; }
  50%{ transform:scaleY(1.15); opacity:1; }
  100%{ transform:scaleY(.45); opacity:.65; }
}

.player.playing .wave i{ animation-play-state:running; }
.player.paused .wave i{ animation-play-state:paused; }

.controls{
  display:grid;
  gap:14px;
  margin-top:2px;
}

.ctrlRow{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:flex-start;
}

.btnGroup{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.btn{
  height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:#fff;
  color:#244150;
  font-weight:900;
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  box-shadow:0 8px 18px rgba(31,53,72,.06);
  transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 24px rgba(31,53,72,.10);
}

.btn.primary{
  background:linear-gradient(135deg, var(--sea), var(--teal));
  border-color:transparent;
  color:#fff;
  box-shadow:0 14px 28px rgba(15,76,92,.20);
}

.btn.ghost{
  background:rgba(15,76,92,.045);
}

.btn.active{
  background:#122c3c;
  border-color:#122c3c;
  color:#fff;
}

.bigPlay{
  min-width:118px;
}

.progress{
  display:grid;
  gap:12px;
  padding-top:12px;
  border-top:1px dashed rgba(25,42,58,.12);
}

.progressRow{
  display:grid;
  grid-template-columns:56px 1fr 56px;
  gap:10px;
  align-items:center;
}

.time{
  color:var(--heading);
  font-weight:900;
  font-size:13px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

.range,
.vol{
  width:100%;
  accent-color:var(--sea);
}

.volRow{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:12px;
  align-items:center;
}

.label{
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}

.hint{
  display:none;
}

.lyricsHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.lyricsTitle{
  color:var(--heading);
  font-size:15px;
  font-weight:900;
}

.lyricsTools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.smallBtn{
  height:34px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line-strong);
  background:rgba(15,76,92,.045);
  color:#244150;
  font-weight:900;
  font-size:12px;
  cursor:pointer;
  transition:.16s ease;
}

.smallBtn:hover{
  background:rgba(15,76,92,.08);
}

.smallBtn.active{
  background:#122c3c;
  border-color:#122c3c;
  color:#fff;
}

.lyricsBox{
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(15,76,92,.025);
  height:420px;
  overflow:auto;
  padding:18px 14px;
  min-width:0;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
}

.lyLine{
  padding:14px 16px;
  border-radius:18px;
  color:rgba(36,65,80,.38);
  cursor:pointer;
  line-height:1.55;
  user-select:none;
  display:flex;
  align-items:flex-start;
  font-size:18px;
  font-weight:900;
  border:1px solid transparent;
  transition:.35s ease;
  opacity:.55;
}

.lyLine:hover{
  background:rgba(15,76,92,.055);
  opacity:.85;
  color:#244150;
}

.lyLine .t{
  display:none;
}

.lyLine .tx{
  min-width:0;
  flex:1 1 auto;
}

.lyLine.active{
  color:var(--heading);
  background:linear-gradient(135deg, rgba(15,76,92,.10), rgba(42,157,143,.10));
  border-color:rgba(15,76,92,.16);
  font-size:26px;
  opacity:1;
  box-shadow:0 14px 30px rgba(31,53,72,.10);
}

.lyLine.active + .lyLine,
.lyLine:has(+ .lyLine.active){
  opacity:.78;
  color:rgba(36,65,80,.68);
}

.lyEmpty{
  padding:12px 10px;
  color:var(--muted);
  font-weight:900;
  font-size:13px;
}

@media (max-width:780px){
  .lyricsBox{
    height:360px;
    padding:16px 12px;
  }

  .lyLine{
    font-size:16px;
  }

  .lyLine.active{
    font-size:22px;
  }
}

@media (max-width:520px){
  .lyricsBox{
    height:320px;
    padding:14px 10px;
  }

  .lyLine.active{
    font-size:20px;
  }
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#122c3c;
  color:#fff;
  padding:9px 15px;
  border-radius:999px;
  font-weight:900;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  box-shadow:0 14px 28px rgba(15,76,92,.22);
  z-index:999;
}

.toast.show{ opacity:1; }

.redesign-player{
  padding:0;
  overflow:hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,.96), rgba(238,247,247,.88)),
    radial-gradient(circle at 82% 12%, rgba(42,157,143,.16), transparent 34%);
}

.nowPlaying{
  display:grid;
  grid-template-columns:230px minmax(0, 1fr);
  gap:22px;
  align-items:stretch;
  padding:22px;
}

.coverDisc{
  position:relative;
  min-height:250px;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(15,76,92,.12);
  background:
    radial-gradient(circle at 34% 28%, rgba(123,223,242,.48), transparent 28%),
    radial-gradient(circle at 78% 76%, rgba(42,157,143,.34), transparent 36%),
    linear-gradient(135deg, rgba(15,76,92,.18), rgba(42,157,143,.12));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20), 0 16px 34px rgba(31,53,72,.12);
}

.coverDisc::before{
  content:"";
  position:absolute;
  width:168px;
  height:168px;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  border-radius:50%;
  background:
    radial-gradient(circle at center, #ffffff 0 13%, rgba(15,76,92,.16) 14% 20%, transparent 21%),
    conic-gradient(from 90deg, rgba(15,76,92,.82), rgba(42,157,143,.72), rgba(123,223,242,.62), rgba(15,76,92,.82));
  box-shadow:0 20px 34px rgba(31,53,72,.16);
  animation:discSpin 8s linear infinite;
  animation-play-state:paused;
}

.coverDisc::after{
  content:"♪";
  position:absolute;
  right:18px;
  bottom:-10px;
  color:rgba(15,76,92,.16);
  font-size:116px;
  line-height:1;
  font-weight:900;
}

.player.playing .coverDisc::before{
  animation-play-state:running;
}

@keyframes discSpin{
  to{ transform:translate(-50%, -50%) rotate(360deg); }
}

.coverBadge{
  position:absolute;
  left:14px;
  top:14px;
  z-index:2;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:32px;
  padding:0 11px;
  border-radius:999px;
  color:#0f4c5c;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.42);
  backdrop-filter:blur(10px);
  font-size:12px;
  font-weight:900;
  box-shadow:0 10px 22px rgba(31,53,72,.10);
}

.coverBadge span{
  width:7px;
  height:7px;
  border-radius:999px;
  background:var(--teal);
  box-shadow:0 0 0 5px rgba(42,157,143,.14);
}

.coverBars{
  position:absolute;
  left:16px;
  bottom:16px;
  z-index:2;
  display:flex;
  align-items:flex-end;
  gap:4px;
  height:34px;
  padding:9px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.42);
  backdrop-filter:blur(10px);
}

.coverBars i{
  display:block;
  width:4px;
  height:9px;
  border-radius:999px;
  background:var(--sea);
  transform-origin:bottom;
  animation:coverWave 850ms ease-in-out infinite;
  animation-play-state:paused;
}

.coverBars i:nth-child(2){ animation-delay:120ms; }
.coverBars i:nth-child(3){ animation-delay:240ms; }
.coverBars i:nth-child(4){ animation-delay:360ms; }
.coverBars i:nth-child(5){ animation-delay:480ms; }

.player.playing .coverBars i{
  animation-play-state:running;
}

@keyframes coverWave{
  0%,100%{ transform:scaleY(.45); opacity:.58; }
  50%{ transform:scaleY(1.45); opacity:1; }
}

.trackPanel{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:16px;
}

.trackHeader{
  min-width:0;
}

.trackLabelRow{

  align-items:center;

  flex-wrap:wrap;

}

.redesign-player .trackTitle{

  letter-spacing:-.055em;

}

.redesign-player .trackDesc{

.playerMetaGrid{

.metaTile{

.mainControls{

  gap:10px;

}

.mainControls .btn{

}

.extraControls{

}

.redesign-player .progress{

.redesign-player .progressRow{

.lyricsCard{

/* =========================
   Cover Music Player V3.2
   Navigation is locked: no .topbar / .brand / .navPills changes here.
   Bottom player is a real grid row, not fixed/floating.
   ========================= */
body{
  padding-bottom:0 !important;
}
.page{
  padding:28px 0 24px;
}
.hero,
.sectionHead{
  display:none !important;
}
.appSection{
  border:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  overflow:visible !important;
}
.app{
  display:grid !important;
  grid-template-columns:280px minmax(0, 1fr) !important;
  grid-template-rows:minmax(0, 1fr) 76px !important;
  grid-template-areas:
    "sidebar main"
    "bottom bottom" !important;
  gap:16px !important;
  padding:0 !important;
  align-items:stretch !important;
  height:calc(100vh - 140px);
  min-height:620px;
}
.card{
  border:1px solid var(--line);
  background:rgba(255,255,255,.70);
  backdrop-filter:blur(22px);
  box-shadow:var(--shadow-soft);
}
.sidebar{
  grid-area:sidebar;
  height:100% !important;
  min-height:0 !important;
  padding:14px !important;
  border-radius:28px !important;
  position:relative !important;
  top:auto !important;
  display:flex !important;
  flex-direction:column !important;
  overflow:hidden !important;
}
.side-title{
  margin-bottom:10px !important;
}
.side-title span{
  font-size:16px !important;
  letter-spacing:-.02em;
}
.search{
  min-height:40px !important;
  height:40px !important;
  font-size:12px !important;
  background:rgba(255,255,255,.84) !important;
}
.song-list{
  flex:1 1 auto !important;
  max-height:none !important;
  overflow:auto !important;
  padding:2px 4px 8px 0 !important;
  margin-top:12px !important;
  display:grid !important;
  align-content:start !important;
  gap:8px !important;
}
.song-item{
  position:relative !important;
  min-height:58px !important;
  padding:9px 8px 9px 50px !important;
  border-radius:18px !important;
  background:rgba(255,255,255,.72) !important;

  align-items:center !important;
  gap:8px !important;

.song-item::before{

  border-radius:12px !important;

  position:absolute !important;

  transform:translateY(-50%) !important;

  font-size:12px !important;
  font-weight:900 !important;

.song-item:hover{

.song-item.active{

.songText{

.songName{

.v3-lyrics .lyricsTitle{
  font-size:17px !important;
  color:var(--heading);
  font-weight:900;
}
.v3-lyrics .smallBtn{
  height:31px;
  padding:0 10px;
  font-size:11px;
}
.v3-lyrics .lyricsBox{
  flex:1 1 auto !important;
  height:auto !important;
  max-height:none !important;
  margin-top:0 !important;
  border-radius:24px !important;
  padding:18px 12px !important;
  background:linear-gradient(180deg, rgba(15,76,92,.035), rgba(255,255,255,.64)) !important;
}
.v3-lyrics .lyLine{
  font-size:17px !important;
  padding:13px 15px !important;
  line-height:1.55 !important;
  opacity:.48;
}
.v3-lyrics .lyLine.active{
  font-size:24px !important;
  line-height:1.42 !important;
  opacity:1;
}
.bottomPlayerHost{
  grid-area:bottom;
  min-height:0;
  overflow:visible;
}
.bottomPlayer.v3Bottom{
  position:relative !important;
  left:auto !important;
  bottom:auto !important;
  transform:none !important;
  z-index:1;
  width:100%;
  height:100%;
  min-height:0;
  border:1px solid rgba(25,42,58,.12);
  border-radius:24px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(24px);
  box-shadow:0 18px 46px rgba(31,53,72,.14);
  padding:10px 12px;
  display:grid;
  grid-template-columns:minmax(220px, 1fr) auto minmax(320px, 1.25fr);
  gap:12px;
  align-items:center;
}
.v3BottomTrack{
  min-width:0;
  display:grid;
  grid-template-columns:44px minmax(0, 1fr);
  gap:10px;
  align-items:center;
}
.v3BottomCover{
  width:44px;
  height:44px;
  border-radius:15px;
  background:var(--active-cover-bg, linear-gradient(135deg, var(--sea), var(--teal)));
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  box-shadow:0 10px 22px rgba(15,76,92,.18);
}
.v3BottomName{
  color:var(--heading);
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.v3BottomDesc{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.v3Controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.v3ControlBtn{
  width:38px;
  height:38px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:#fff;
  color:#244150;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(31,53,72,.07);
}
.v3ControlBtn.play{
  width:48px;
  background:linear-gradient(135deg, var(--sea), var(--teal));
  border-color:transparent;
  color:#fff;
}
.v3ProgressWrap{
  min-width:0;
  display:grid;
  grid-template-columns:44px 1fr 44px 82px;
  gap:8px;
  align-items:center;
}
.v3ProgressWrap .time{
  font-size:11px;
}
.v3ProgressWrap .range,
.v3ProgressWrap .vol{
  width:100%;
}
@media (max-width:1120px){
  .app{
    height:auto;
    min-height:0;
    grid-template-columns:1fr !important;
    grid-template-rows:auto auto auto !important;
    grid-template-areas:
      "sidebar"
      "main"
      "bottom" !important;
  }
  .sidebar{
    height:auto !important;
    max-height:none !important;
  }
  .song-list{
    max-height:360px !important;
  }
  .playerShell{
    height:auto !important;
    grid-template-columns:1fr !important;
  }
  .player.v3-info{ min-height:420px !important; }
  .lyricsCard.v3-lyrics{ min-height:460px !important; }
  .bottomPlayerHost{ min-height:148px; }
  .bottomPlayer.v3Bottom{
    min-height:148px;
    grid-template-columns:1fr;
    gap:8px;
    border-radius:22px;
  }
  .v3ProgressWrap{
    grid-template-columns:42px 1fr 42px;
  }
  .v3ProgressWrap .vol{ display:none; }
}
@media (max-width:640px){
  .page{ padding-left:10px; padding-right:10px; }
  .v3Title{ font-size:28px; }
  .v3Cover{ width:132px; height:132px; border-radius:24px; }
  .v3MetaGrid{ grid-template-columns:1fr; }
  .v3-lyrics .lyLine.active{ font-size:21px !important; }
  .v3BottomTrack{ grid-template-columns:38px minmax(0, 1fr); }
  .v3BottomCover{ width:38px; height:38px; border-radius:13px; }
  .v3Controls .v3ControlBtn{ width:36px; height:36px; }
  .v3Controls .v3ControlBtn.play{ width:44px; }
}

</style>

const $ = id => document.getElementById(id);

let lastLyricsUrl = "";

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function fmt(sec){
  if(!isFinite(sec) || sec < 0) return "00:00";
  const s = Math.floor(sec);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
}

function sortSongs(){
  SONGS.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1200);
}

function clamp(v,min,max){
  return Math.max(min, Math.min(max, v));
}

function idxById(id){
  return Math.max(0, SONGS.findIndex(s => s.id === id));
}

function currentSong(){
  return SONGS.find(s => s.id === currentId) || SONGS[0] || null;
}

function parseLRC(text){
  const src = String(text || "").replace(/\r/g, "");
  const lines = src.split("\n");

  let offsetMs = 0;
  for(const raw of lines){
    const line = raw.replace(/^\uFEFF/, "").trim();
    const m = line.match(/^\[offset:\s*([+-]?\d+)\s*\]$/i);
    if(m){ offsetMs = Number(m[1]) || 0; break; }
  }

  const offsetSec = offsetMs / 1000;
  const out = [];
  const timeTag = /[\[<](\d{1,2}):(\d{2})(?:\.(\d{1,3}))?[\]>]/g;

  for(const raw of lines){
    const line = raw.replace(/^\uFEFF/, "").trim();
    if(!line) continue;
    if(/^\[(ti|ar|al|by|length|re|ve):/i.test(line)) continue;
    if(/^\[offset:/i.test(line)) continue;

    const tags = [...line.matchAll(timeTag)];
    if(tags.length === 0) continue;

    const textPart = line.replace(timeTag, "").trim();
    for(const t of tags){
      const mm = Number(t[1]);
      const ss = Number(t[2]);
      const frac = t[3] ? t[3].padEnd(3,"0") : "000";
      let time = mm * 60 + ss + Number(frac) / 1000;
      time = time + offsetSec;
      if(time < 0) time = 0;
      out.push({ time, text: textPart || "…" });
    }
  }

  out.sort((a,b) => a.time - b.time);

  const merged = [];
  for(const item of out){
    const last = merged[merged.length - 1];
    if(last && Math.abs(last.time - item.time) < 0.001){
      last.text = item.text;
    }else{
      merged.push(item);
    }
  }
  return merged;
}

async function loadLyricsForSong(song){
  lyrics = [];
  activeLyIndex = -1;

  const url = String(song?.lrcUrl || "").trim();
  lastLyricsUrl = url;
  renderLyrics();

  if(!url) return;

  try{
    const bust = (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    const res = await fetch(url + bust, { cache:"no-store" });
    if(!res.ok) throw new Error("fetch failed");

    const txt = await res.text();
    if(String(song?.lrcUrl || "").trim() !== lastLyricsUrl) return;
    lyrics = parseLRC(txt);
  }catch(e){
    lyrics = [];
    showToast("歌詞載入失敗");
  }

  renderLyrics();
  syncLyricsActive(true);
}

function findActiveLyIndex(t){
  if(!lyrics.length) return -1;
  let lo = 0, hi = lyrics.length - 1, ans = -1;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(lyrics[mid].time <= t + 0.01){
      ans = mid;
      lo = mid + 1;
    }else{
      hi = mid - 1;
    }
  }
  return ans;
}


function coverGradient(song){
  const palette = [
    ["#0f4c5c", "#2a9d8f", "#7bdff2"],
    ["#264653", "#2a9d8f", "#e9c46a"],
    ["#355070", "#6d597a", "#b56576"],
    ["#1d3557", "#457b9d", "#a8dadc"],
    ["#3a506b", "#5bc0be", "#c8f7f4"],
    ["#2b2d42", "#8d99ae", "#edf2f4"],
    ["#0b3954", "#087e8b", "#bfd7ea"],
    ["#4a4e69", "#9a8c98", "#f2e9e4"]
  ];
  const id = Number(String(song?.id || "0").replace(/\D/g, "")) || 0;
  const p = palette[id % palette.length];
  return `linear-gradient(135deg, ${p[0]}, ${p[1]} 58%, ${p[2]})`;
}

function shortYearDate(dateText){
  const s = String(dateText || "");
  return s.replace(/^20/, "");
}

function firstLetter(text){
  const s = String(text || "音").trim();
  return s ? s.slice(0, 1) : "音";
}

function renderList(){
  const box = $("songList");
  box.innerHTML = "";
  const q = searchKeyword.trim().toLowerCase();
  const filtered = SONGS.filter(s => !q || String(s.name || "").toLowerCase().includes(q) || String(s.desc || "").toLowerCase().includes(q));

  if(filtered.length === 0){
    const empty = document.createElement("div");
    empty.style.padding = "10px 12px";
    empty.style.color = "#6a7d89";
    empty.style.fontWeight = "900";
    empty.textContent = "沒有符合的歌曲";
    box.appendChild(empty);
    return;
  }

  filtered.forEach(s => {
    const div = document.createElement("div");
    div.className = "song-item" + (s.id === currentId ? " active" : "");
    div.style.setProperty("--song-cover", coverGradient(s));
    div.innerHTML = `
      <div class="songText">
        <div class="songName">${escapeHtml(s.name)}</div>
        <div class="songMeta">${escapeHtml(s.desc || "翻唱作品")}</div>
      </div>
      <div class="songDate">${escapeHtml(shortYearDate(s.createdAt))}</div>
    `;
    div.onclick = () => loadById(s.id, false);
    box.appendChild(div);
  });
}

function loadById(id, autoplay){
  const s = SONGS.find(x => x.id === id);
  if(!s) return;

  currentId = id;
  audio.src = String(s.mp3Url || "").trim();
  audio.load();

  renderPlayer();
  renderList();
  loadLyricsForSong(s);

  if(autoplay){
    audio.play().catch(() => showToast("無法播放（可能跨域或連結失效）"));
  }
}

function nextSong(){
  const i = idxById(currentId);
  if(i < SONGS.length - 1){
    loadById(SONGS[i + 1].id, true);
  }else if(loopMode === "list"){
    loadById(SONGS[0].id, true);
  }else{
    audio.pause();
    syncPlayBtn();
    syncPlayerStateClass();
  }
}

function prevSong(){
  const i = idxById(currentId);
  if(i > 0){
    loadById(SONGS[i - 1].id, true);
  }else{
    loadById(SONGS[SONGS.length - 1].id, true);
  }
}

function loopLabel(){
  if(loopMode === "list") return "清單循環";
  if(loopMode === "single") return "單曲循環";
  return "不循環";
}

function syncLoopBtn(){
  const b = $("loopBtn");
  const pill = $("loopPill");
  if(b){
    b.textContent = loopLabel();
    b.classList.remove("active");
    if(loopMode !== "off") b.classList.add("active");
  }
  if(pill) pill.textContent = loopLabel();
}

function syncPlayBtn(){
  const b = $("playBtn");
  if(b) b.textContent = audio.paused ? "▶" : "Ⅱ";
}

function syncPlayerStateClass(){
  const root = $("playerRoot");
  if(!root) return;
  root.classList.toggle("playing", !audio.paused);
  root.classList.toggle("paused", audio.paused);
}

function bindWheelControls(){
  const playerEl = $("playerRoot");
  const seek = $("seek");
  const vol = $("vol");

  if(playerEl){
    playerEl.addEventListener("wheel", (e) => {
      if(e.ctrlKey) return;
      const t = e.target;
      if(t && (t.id === "seek" || t.id === "vol")) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      audio.volume = clamp((audio.volume ?? 0.5) + delta, 0, 1);
      if(vol) vol.value = String(audio.volume);
    }, { passive:false });
  }

  if(seek){
    seek.addEventListener("wheel", (e) => {
      if(e.ctrlKey) return;
      e.preventDefault();
      if(!isFinite(audio.duration) || audio.duration <= 0) return;
      const step = e.shiftKey ? 15 : 5;
      const dir = e.deltaY > 0 ? -1 : 1;
      audio.currentTime = clamp(audio.currentTime + dir * step, 0, audio.duration);
    }, { passive:false });
  }

  if(vol){
    vol.addEventListener("wheel", (e) => {
      if(e.ctrlKey) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      audio.volume = clamp((audio.volume ?? 0.5) + delta, 0, 1);
      vol.value = String(audio.volume);
    }, { passive:false });
  }
}

function renderLyrics(){
  const box = $("lyricsBox");
  const autoBtn = $("lyAutoBtn");
  const foldBtn = $("lyFoldBtn");

  if(autoBtn) autoBtn.classList.toggle("active", !!lyricsAutoScroll);
  if(foldBtn) foldBtn.textContent = lyricsCollapsed ? "展開歌詞" : "收合歌詞";
  if(!box) return;

  if(lyricsCollapsed){
    box.style.display = "none";
    return;
  }else{
    box.style.display = "";
  }

  if(!lyrics.length){
    box.innerHTML = `<div class="lyEmpty">沒有歌詞</div>`;
    return;
  }

  box.innerHTML = lyrics.map((l, i) => {
    const t = fmt(l.time);
    const active = i === activeLyIndex ? " active" : "";
    return `<div class="lyLine${active}" data-t="${l.time}">
      <div class="tx" title="${escapeHtml(l.text)}">${escapeHtml(l.text)}</div>
    </div>`;
  }).join("");

  box.querySelectorAll(".lyLine").forEach(el => {
    el.onclick = () => {
      const t = Number(el.getAttribute("data-t") || "0");
      if(isFinite(t)) audio.currentTime = clamp(t, 0, isFinite(audio.duration) ? audio.duration : t);
      audio.play().catch(() => {});
      lyricsAutoScroll = false;
      renderLyricsToolsState();
      syncLyricsActive(true);
    };
  });
}

function renderLyricsToolsState(){
  const autoBtn = $("lyAutoBtn");
  if(autoBtn) autoBtn.classList.toggle("active", !!lyricsAutoScroll);
}

function syncLyricsActive(forceScroll){
  if(!lyrics.length) return;

  const box = $("lyricsBox");
  if(!box || lyricsCollapsed) return;

  const idx = findActiveLyIndex(audio.currentTime || 0);
  if(idx === activeLyIndex && !forceScroll) return;

  activeLyIndex = idx;

  const lines = box.querySelectorAll(".lyLine");

  lines.forEach((el, i) => {
    el.classList.toggle("active", i === activeLyIndex);
  });

  if(activeLyIndex < 0 || !lines[activeLyIndex]) return;

  if(lyricsAutoScroll || forceScroll){
    const activeLine = lines[activeLyIndex];

    const boxRect = box.getBoundingClientRect();
    const lineRect = activeLine.getBoundingClientRect();

    const currentScroll = box.scrollTop;
    const lineCenter = lineRect.top - boxRect.top + currentScroll + lineRect.height / 2;
    const targetTop = lineCenter - box.clientHeight / 2;

    const maxTop = Math.max(0, box.scrollHeight - box.clientHeight);

    box.scrollTo({
      top:Math.max(0, Math.min(targetTop, maxTop)),
      behavior:forceScroll ? "auto" : "smooth"
    });
  }
}

          <input type="range" id="seek" class="range" min="0" max="1000" value="0" />
          <span class="time" id="dur">00:00</span>
          <input type="range" id="vol" class="vol" min="0" max="1" step="0.01" value="${audio.volume}" title="音量" />
        </div>
      </div>
    `;
  }

  $("prevBtn").onclick = prevSong;
  $("nextBtn").onclick = nextSong;

  $("playBtn").onclick = async () => {
    if(audio.paused){
      try{ await audio.play(); }
      catch{ showToast("無法播放"); }
    }else{
      audio.pause();
    }
    syncPlayBtn();
    syncPlayerStateClass();
  };

  $("loopBtn").onclick = () => {
    if(loopMode === "list") loopMode = "single";
    else if(loopMode === "single") loopMode = "off";
    else loopMode = "list";
    syncLoopBtn();
  };

  $("copyBtn").onclick = async () => {
    const url = String(s.mp3Url || "").trim();
    try{
      await navigator.clipboard.writeText(url);
      showToast("連結已複製");
    }catch{
      showToast("複製失敗");
    }
  };

  $("lyAutoBtn").onclick = () => {
    lyricsAutoScroll = !lyricsAutoScroll;
    renderLyricsToolsState();
    if(lyricsAutoScroll) syncLyricsActive(true);
  };

  $("lyFoldBtn").onclick = () => {
    lyricsCollapsed = !lyricsCollapsed;
    renderLyrics();
  };

  $("lyReloadBtn").onclick = () => {
    const s2 = currentSong();
    if(s2) loadLyricsForSong(s2);
  };

  $("vol").oninput = () => {
    audio.volume = Number($("vol").value);
  };

  $("seek").oninput = () => {
    if(isFinite(audio.duration) && audio.duration > 0){
      audio.currentTime = (Number($("seek").value) / 1000) * audio.duration;
      syncLyricsActive(false);
    }
  };

  const lyBox = $("lyricsBox");
  if(lyBox){
    let userScrolling = false;
    lyBox.addEventListener("touchstart", () => { userScrolling = true; }, { passive:true });
    lyBox.addEventListener("wheel", () => { userScrolling = true; }, { passive:true });
    lyBox.addEventListener("scroll", () => {
      if(userScrolling && lyricsAutoScroll){
        lyricsAutoScroll = false;
        renderLyricsToolsState();
      }
    }, { passive:true });
    lyBox.addEventListener("touchend", () => { userScrolling = false; }, { passive:true });
  }

  syncPlayBtn();
  syncLoopBtn();
  syncPlayerStateClass();
  bindWheelControls();
  renderLyrics();
}

  if(cur) cur.textContent = fmt(audio.currentTime);
  if(dur && isFinite(audio.duration) && audio.duration > 0) dur.textContent = fmt(audio.duration);
  if(seek && isFinite(audio.duration) && audio.duration > 0){
    seek.value = String(Math.floor((audio.currentTime / audio.duration) * 1000));

  syncLyricsActive(false);
});

document.addEventListener("keydown", (e) => {
  const tag = String(e.target?.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;
  if(e.code === "Space"){
    e.preventDefault();
    const btn = $("playBtn");
    if(btn) btn.click();
  }
  if(e.key === "ArrowRight"){
    if(isFinite(audio.duration) && audio.duration > 0){
      audio.currentTime = clamp((audio.currentTime || 0) + 5, 0, audio.duration);
    }
  }
  if(e.key === "ArrowLeft"){
    if(isFinite(audio.duration) && audio.duration > 0){
      audio.currentTime = clamp((audio.currentTime || 0) - 5, 0, audio.duration);
    }
  }
});

  }

  currentId = SONGS[0].id;
  loadById(currentId, false);
  renderList();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initCoverPlayer);
}else{
  initCoverPlayer();
}

</script>
<script>
(async () => {

const box = document.getElementById("siteAnnouncement");

if(!box) return;

try{

const res = await fetch("data/announcement.json?t="+Date.now());

const data = await res.json();

if(!data.enabled){
    box.remove();
    return;
}

box.innerHTML=`
<div class="announcementBar">

    <div class="announcementIcon">
        📢
    </div>

    <div class="announcementContent">

        <div class="announcementTitle">
            ${data.title || "重要公告"}
        </div>

        <div class="announcementText">
            ${data.content || data.message || ""}
        </div>

        <div class="announcementTime">
            更新時間：${data.updated || ""}
        </div>

    </div>

</div>
`;

}catch(e){

console.log(e);

}

})();
</script>
</script>
