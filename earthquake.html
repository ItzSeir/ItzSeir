<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筱風｜地震情報</title>
  <link rel="icon" type="image/png" href="Profile%20Pitcure/ItzSeirProfile.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#eef4f7;
      --bg2:#e3edf2;
      --surface:#ffffff;
      --surface-soft:rgba(255,255,255,.76);
      --surface-glass:rgba(255,255,255,.84);
      --line:rgba(25,42,58,.10);
      --line-strong:rgba(25,42,58,.16);
      --text:#163042;
      --heading:#122c3c;
      --muted:#6a7d89;
      --muted2:#9aabb6;
      --sea:#0f4c5c;
      --teal:#2a9d8f;
      --ice:#7bdff2;
      --warm:#f4a261;
      --danger:#d62828;
      --shadow:0 18px 50px rgba(31,53,72,.12);
      --shadow-soft:0 10px 30px rgba(31,53,72,.08);
      --radius:28px;
      --radius2:20px;
      --max:1240px;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }

    body{
      margin:0;
      min-height:100vh;
      font-family:"Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% -10%, rgba(42,157,143,.18), transparent 34%),
        radial-gradient(circle at 88% 6%, rgba(123,223,242,.18), transparent 30%),
        linear-gradient(180deg, #f7fbfc 0%, var(--bg) 48%, #ffffff 100%);
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(15,76,92,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,76,92,.05) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(180deg, rgba(0,0,0,.72), transparent 76%);
      z-index:-1;
    }

    a{ color:inherit; }
    button,input,select{ font:inherit; }

    .page{
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto;
      padding:28px 0 54px;
    }

    .topbar{
      position:sticky;
      top:12px;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:22px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(18px);
      box-shadow:0 10px 30px rgba(31,53,72,.08);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      text-decoration:none;
    }

    .brandMark{
      width:36px;
      height:36px;
      flex:0 0 auto;
      border-radius:14px;
      overflow:hidden;
      background:linear-gradient(135deg, var(--sea), var(--teal));
      box-shadow:0 10px 22px rgba(15,76,92,.22);
    }
    
    .brandMark img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .brandText{
      display:flex;
      flex-direction:column;
      min-width:0;
      line-height:1.1;
    }

    .brandText strong{
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brandText span{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .navPills{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }

    .navPills a{
      text-decoration:none;
      color:#264052;
      font-size:12px;
      font-weight:900;
      padding:9px 12px;
      border-radius:999px;
      transition:.18s ease;
    }

    .navPills a:hover,
    .navPills a.active{
      color:var(--sea);
      background:linear-gradient(135deg, rgba(15,76,92,.10), rgba(42,157,143,.12));
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0, 1.1fr) minmax(320px, .9fr);
      gap:22px;
      align-items:stretch;
      margin-bottom:22px;
    }

    .heroCard,
    .quickPanel{
      border:1px solid var(--line);
      border-radius:32px;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .heroCard{
      position:relative;
      min-height:330px;
      padding:34px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.98), rgba(236,245,246,.90)),
        radial-gradient(circle at 86% 14%, rgba(42,157,143,.15), transparent 34%);
    }

    .heroCard::after{
      content:"";
      position:absolute;
      right:-120px;
      bottom:-150px;
      width:340px;
      height:340px;
      border-radius:50%;
      border:42px solid rgba(15,76,92,.075);
      pointer-events:none;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      max-width:100%;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid rgba(15,76,92,.14);
      color:var(--sea);
      background:rgba(15,76,92,.08);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:999px;
      display:inline-block;
      background:var(--teal);
      flex:0 0 auto;
    }

    .pillDot{
      width:5px;
      height:5px;
      border-radius:999px;
      background:#c97920;
      box-shadow:0 0 0 4px rgba(244,162,97,.13);
      flex:0 0 auto;
    }

    .miniPill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      width:max-content;
      max-width:100%;
      padding:7px 12px;
      border-radius:999px;
      color:#9a5a12;
      background:linear-gradient(135deg, rgba(244,162,97,.18), rgba(255,239,221,.92));
      border:1px solid rgba(244,162,97,.22);
      box-shadow:0 8px 18px rgba(244,162,97,.10);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .heroTitle{
      position:relative;
      z-index:1;
      margin:24px 0 18px;
      font-size:clamp(40px, 5vw, 68px);
      line-height:1.12;
      letter-spacing:-.045em;
      font-weight:900;
      color:var(--heading);
    }

    .heroTitle span{
      display:block;
      color:transparent;
      background:linear-gradient(135deg, var(--sea), var(--teal));
      -webkit-background-clip:text;
      background-clip:text;
    }

    .heroDesc{
      position:relative;
      z-index:1;
      max-width:760px;
      margin:0;
      color:#5e717d;
      line-height:1.85;
      font-size:14px;
      font-weight:650;
    }

    .heroActions{
      position:relative;
      z-index:1;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:26px;
    }

    .actionBtn,
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:0 15px;
      border-radius:999px;
      border:0;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      color:#fff;
      background:linear-gradient(135deg, var(--sea), var(--teal));
      box-shadow:0 14px 28px rgba(15,76,92,.20);
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      white-space:nowrap;
    }

    .actionBtn:hover,
    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 18px 34px rgba(15,76,92,.24);
    }

    .ghostBtn,
    .btnGhost{
      color:#1d3a4a;
      background:#fff;
      border:1px solid var(--line-strong);
      box-shadow:0 10px 22px rgba(31,53,72,.07);
    }

    .btn:disabled{
      cursor:not-allowed;
      opacity:.62;
      transform:none;
    }

    .quickPanel{
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .quakeVisual{
      position:relative;
      min-height:170px;
      border-radius:24px;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 30% 24%, rgba(214,40,40,.16), transparent 28%),
        radial-gradient(circle at 72% 72%, rgba(42,157,143,.24), transparent 34%),
        linear-gradient(135deg, rgba(15,76,92,.13), rgba(42,157,143,.08));
      overflow:hidden;
    }

    .quakeVisual::before{
      content:"";
      position:absolute;
      left:24px;
      top:50%;
      width:80%;
      height:2px;
      background:linear-gradient(90deg, transparent, rgba(15,76,92,.28), transparent);
      transform:translateY(-50%);
    }

    .quakeVisual::after{
      content:"M";
      position:absolute;
      right:22px;
      bottom:8px;
      color:rgba(15,76,92,.14);
      font-size:120px;
      line-height:1;
      letter-spacing:-.08em;
      font-weight:900;
    }

    .quickTitle{
      margin:0;
      color:var(--heading);
      font-size:22px;
      line-height:1.2;
      letter-spacing:-.035em;
      font-weight:900;
    }

    .quickText{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.75;
      font-weight:650;
    }

    .quickGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:auto;
    }

    .quickStat{
      min-height:82px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
    }

    .quickNum{
      color:var(--heading);
      font-size:24px;
      font-weight:900;
      line-height:1;
      letter-spacing:-.04em;
    }

    .quickLabel{
      margin-top:8px;
      color:var(--muted);
      font-size:12px;
      font-weight:900;
    }

    .section{
      scroll-margin-top:110px;
      margin-top:22px;
      border:1px solid var(--line);
      border-radius:32px;
      background:rgba(255,255,255,.76);
      backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .sectionHead{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      padding:24px 24px 16px;
      border-bottom:1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(15,76,92,.06), rgba(42,157,143,.05)),
        rgba(255,255,255,.58);
    }

    .sectionKicker{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--sea);
      font-size:12px;
      font-weight:900;
      margin-bottom:7px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .sectionTitle{
      margin:0;
      color:var(--heading);
      font-size:clamp(24px, 3vw, 38px);
      line-height:1.18;
      letter-spacing:-.035em;
      font-weight:900;
    }

    .sectionDesc{
      margin:8px 0 0;
      max-width:760px;
      color:var(--muted);
      font-size:13px;
      line-height:1.75;
      font-weight:650;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    .toggle{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:#244150;
      font-size:12px;
      font-weight:900;
      user-select:none;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 8px 18px rgba(31,53,72,.06);
    }

    .toggle input{
      accent-color:var(--sea);
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:7px;
      min-height:34px;
      padding:0 11px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:#244150;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
      box-shadow:0 8px 18px rgba(31,53,72,.05);
    }

    .countrySwitch{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.86);
      box-shadow:0 8px 18px rgba(31,53,72,.05);
    }

    .countryTab{
      min-height:36px;
      padding:0 14px;
      border:0;
      border-radius:999px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      transition:.16s ease;
      white-space:nowrap;
    }

    .countryTab:hover{
      color:var(--sea);
      background:rgba(15,76,92,.06);
    }

    .countryTab.active{
      color:#fff;
      background:linear-gradient(135deg, var(--sea), var(--teal));
      box-shadow:0 8px 18px rgba(15,76,92,.18);
    }

    .quakeBody{
      --tracker-h:680px;
      display:grid;
      grid-template-columns:330px minmax(0, 1fr);
      gap:18px;
      padding:20px;
      align-items:stretch;
    }

    .sideStack{
      display:flex;
      flex-direction:column;
      gap:14px;
      min-width:0;
      height:var(--tracker-h);
    }

    .panelBox{
      min-width:0;
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.86);
      box-shadow:var(--shadow-soft);
      overflow:hidden;
    }

    .pbHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.72);
    }

    .pbTitle{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--heading);
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
    }

    .pbBody{
      padding:14px;
    }

    .select{
      width:100%;
      min-height:42px;
      margin-bottom:12px;
      padding:0 13px;
      border-radius:16px;
      border:1px solid var(--line-strong);
      outline:none;
      background:#fff;
      color:var(--heading);
      font-size:12px;
      font-weight:900;
      box-shadow:0 8px 18px rgba(31,53,72,.05);
    }

    .select:focus{
      border-color:rgba(15,76,92,.28);
      box-shadow:0 0 0 4px rgba(15,76,92,.08);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      height:calc(var(--tracker-h) - 164px);
      max-height:none;
      overflow-y:auto;
      padding-right:3px;
      overscroll-behavior:contain;
    }

    .list::-webkit-scrollbar,
    .countyGrid::-webkit-scrollbar{ width:10px; }
    .list::-webkit-scrollbar-thumb,
    .countyGrid::-webkit-scrollbar-thumb{
      background:rgba(15,76,92,.20);
      border-radius:999px;
      border:3px solid rgba(255,255,255,.8);
    }

    .item{
      padding:12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .item:hover{
      transform:translateY(-2px);
      border-color:rgba(15,76,92,.18);
      box-shadow:0 12px 24px rgba(31,53,72,.09);
    }

    .itemTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:7px;
    }

    .itemTime{
      color:var(--heading);
      font-size:12px;
      line-height:1.45;
      font-weight:900;
    }

    .itemMag{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      color:#9b3d34;
      background:rgba(214,40,40,.09);
      border:1px solid rgba(214,40,40,.16);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .itemLoc{
      color:#536b77;
      font-size:12px;
      line-height:1.55;
      font-weight:750;
    }

    .infoGrid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:10px;
    }

    .infoCard{
      min-height:78px;
      padding:13px;
      border-radius:18px;
      border:1px solid var(--line);
      background:#fff;
    }

    .val{
      color:var(--heading);
      font-size:18px;
      line-height:1.2;
      font-weight:900;
      word-break:break-word;
    }

    .lab{
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:900;
    }

    .countyTitle{
      margin:14px 0 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:var(--heading);
      font-size:13px;
      font-weight:900;
    }

    .countyGrid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:8px;
      max-height:220px;
      overflow-y:auto;
      padding-right:3px;
    }

    .countyItem{
      min-width:0;
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px 10px;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
    }

    .countyName{
      min-width:0;
      color:var(--heading);
      font-size:12px;
      font-weight:900;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .countyInt{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      gap:7px;
      min-height:28px;
      padding:0 9px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.88);
      color:#244150;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .iDot{
      width:10px;
      height:10px;
      border-radius:999px;
      display:inline-block;
    }

    .hint{
      margin-top:9px;
      color:var(--muted);
      font-size:12px;
      line-height:1.55;
      font-weight:850;
    }

    .mapShell{
      min-width:0;
      height:var(--tracker-h);
      border:1px solid var(--line);
      border-radius:26px;
      background:#fff;
      box-shadow:0 12px 28px rgba(31,53,72,.08);
      overflow:hidden;
    }

    .reportPanel{
      height:100%;
    }

    .infoPanel{
      grid-column:1 / -1;
    }

    .mapHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      padding:14px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.76);
    }

    .mapHeader strong{
      display:block;
      color:var(--heading);
      font-size:15px;
      font-weight:900;
      line-height:1.25;
    }

    .mapHeader span{
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
      line-height:1.45;
    }

    .mapLegendInline{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .legendTiny{
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-height:30px;
      padding:0 9px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      color:#244150;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .legendTiny i{
      display:block;
      width:10px;
      height:10px;
      border-radius:999px;
    }

    #map{
      width:100%;
      height:calc(var(--tracker-h) - 74px);
      min-height:0;
      background:#f4fafb;
    }

    .legend{
      background:rgba(255,255,255,.92);
      border:1px solid rgba(25,42,58,.12);
      border-radius:16px;
      padding:10px;
      box-shadow:0 12px 26px rgba(31,53,72,.12);
      color:var(--heading);
      font-size:12px;
      font-weight:900;
      line-height:1.4;
    }

    .legend .row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:6px;
    }

    .swatch{
      width:14px;
      height:14px;
      border-radius:6px;
      border:1px solid rgba(25,42,58,.14);
    }

    .epi{
      position:relative;
      z-index:9999;
      width:20px;
      height:20px;
      border-radius:999px;
      background:rgba(214,40,40,1);
      border:3px solid #fff;
      box-shadow:0 12px 26px rgba(214,40,40,.25);
    }

    .stn{
      width:26px;
      height:26px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;

  <script>
    /***********************
     * CWA 授權碼
     ***********************/
    const CWA_AUTH = "CWA-BC6BF68E-0B38-43B1-A5F5-811E1C06742B";

    /***********************
     * Mapbox style/token
     ***********************/
    const MAPBOX_TOKEN = "pk.eyJ1IjoiaXR6c2VpciIsImEiOiJja240bTE0ZXYxc2xqMm5tbng1ZDd0a3Y1In0.8z3D3HF0GTrWJXZ9YtVT8Q";
    const MAPBOX_STYLE = "itzseir/cmjoiqmu000g401qqh40c87nx";

    /***********************
     * CWA 地震資料集
     * 顯著有感地震：E-A0015-001
     * 小區域地震：E-A0016-001
     ***********************/
    const API_BASE = "https://opendata.cwa.gov.tw/api/v1/rest/datastore/";
    const DATASET_SIGNIFICANT = "E-A0015-001";
    const DATASET_LOCAL = "E-A0016-001";

    /***********************
     * Malaysia earthquake Excel
     ***********************/
    const MALAYSIA_XLSX_PATH = "data/Earthquake.xlsx";

    const AUTO_REFRESH_SEC = 60;
    let autoTimer = null;
    let nextTickTimer = null;

    const $ = (id) => document.getElementById(id);

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function toNum(x){
      const n = Number(x);
      return Number.isFinite(n) ? n : null;
    }

    function normalizeIntensityLabel(raw){
      const s = String(raw ?? "").trim();
      if(!s) return { label:null, bucket:null };

      if(/7\s*(強|\+)/.test(s) || /7\+/.test(s)) return { label:"7+", bucket:7 };
      if(/7\s*(弱|\-)/.test(s) || /7\-/.test(s)) return { label:"7-", bucket:7 };
      if(/^7$/.test(s) || /震度\s*7/.test(s)) return { label:"7", bucket:7 };
      if(/6\s*(強|\+)/.test(s) || /6\+/.test(s)) return { label:"6+", bucket:6 };
      if(/6\s*(弱|\-)/.test(s) || /6\-/.test(s)) return { label:"6-", bucket:6 };
      if(/5\s*(強|\+)/.test(s) || /5\+/.test(s)) return { label:"5+", bucket:5 };
      if(/5\s*(弱|\-)/.test(s) || /5\-/.test(s)) return { label:"5-", bucket:5 };

      const m = s.match(/([0-7])/);
      if(m) return { label:m[1], bucket:Number(m[1]) };

      return { label:s, bucket:null };
    }

    const palette = {
      0:"#94a3b8",
      1:"#60a5fa",
      2:"#34d399",
      3:"#fbbf24",
      4:"#fb923c",
      "5-":"#f87171",
      "5+":"#dc2626",
      5:"#ef4444",
      "6-":"#c084fc",
      "6+":"#7e22ce",
      6:"#a855f7",
      "7-":"#4b5563",
      "7+":"#111827",
      7:"#1f2937"
    };

    function intensityColor(labelOrBucket, fallbackBucket=null){
      const key = String(labelOrBucket ?? "").trim();
      if(key && palette[key]) return palette[key];
      const b = Math.max(0, Math.min(7, (fallbackBucket ?? labelOrBucket ?? 0)|0));
      return palette[b] || "#111827";
    }

    function magnitudeColor(mag){
      /* 只用於左邊地震報告列表的 M pill，不影響地圖震央 */
      if(mag == null) return "#94a3b8";
      if(mag < 4.0) return "#94a3b8";
      if(mag < 5.0) return "#16a34a";
      if(mag <= 5.5) return "#facc15";
      if(mag <= 6.4) return "#f97316";
      return "#dc2626";
    }

    const malaysiaStatePalette = [
      "#2563eb", "#dc2626", "#16a34a", "#d97706", "#7c3aed", "#0891b2",
      "#ea580c", "#0f766e", "#e11d48", "#65a30d", "#9333ea", "#4f46e5",
      "#b45309", "#0ea5e9", "#be123c", "#15803d", "#7e22ce"
    ];

    function getMalaysiaStateNames(){
      return Array.from(new Set(
        cachedMalaysia
          .map(eq => String(eq?._state ?? "").trim())
          .filter(Boolean)
      )).sort((a, b) => a.localeCompare(b, "zh-Hant"));
    }

    function getMalaysiaStateColor(state){
      const clean = String(state ?? "").trim();
      if(!clean) return "#64748b";
      const states = getMalaysiaStateNames();
      const idx = Math.max(0, states.indexOf(clean));
      return malaysiaStatePalette[idx % malaysiaStatePalette.length];
    }

    function getMalaysiaMarkerRadius(mag){
      const n = Number(mag);
      if(!Number.isFinite(n)) return 8;
      return Math.max(6, Math.min(18, 4 + n * 2.2));
    }

    function buildMalaysiaStateSummary(){
      const m = new Map();
      for(const eq of cachedMalaysia){
        const state = String(eq?._state ?? "").trim() || "未知州屬";
        const mag = getMagnitude(eq);
        const cur = m.get(state) || { state, count:0, maxMag:null };
        cur.count += 1;
        if(mag != null && (cur.maxMag == null || mag > cur.maxMag)) cur.maxMag = mag;
        m.set(state, cur);
      }
      return Array.from(m.values()).sort((a,b) => (b.count - a.count) || a.state.localeCompare(b.state, "zh-Hant"));
    }

    let map;
    let epicenterMarker = null;
    const stationMarkers = [];
    const malaysiaMarkers = [];
    let legendCtrl = null;

    let cachedAll = [];
    let cachedTaiwan = [];
    let cachedMalaysia = [];
    let activeCountry = "taiwan";
    let currentIndex = 0;
    let lastRenderedKey = "";

    function buildLegend(){
      if(legendCtrl) legendCtrl.remove();
      legendCtrl = L.control({ position:"bottomleft" });
      legendCtrl.onAdd = () => {
        const el = L.DomUtil.create("div", "legend");
        if(activeCountry === "malaysia"){
          const states = getMalaysiaStateNames();
          el.innerHTML = `
            <div style="font-weight:900;font-size:12px;">馬來西亞州屬圖例</div>
            <div style="margin-top:4px;color:#64748b;font-size:11px;font-weight:800;line-height:1.55;">顏色代表州屬；圓點大小依規模顯示。</div>
            ${states.map(state => `
              <div class="row">
                <span class="swatch" style="background:${getMalaysiaStateColor(state)};border-radius:999px;"></span>
                <span>${escapeHtml(state)}</span>
              </div>
            `).join("") || `<div class="row"><span>目前沒有州屬資料</span></div>`}
          `;
        }else{
          el.innerHTML = `
            <div style="font-weight:900;font-size:12px;">圖例</div>
            ${[
              ["震度 0", palette[0]],
              ["震度 1", palette[1]],
              ["震度 2", palette[2]],
              ["震度 3", palette[3]],
              ["震度 4", palette[4]],
              ["震度 5-", palette["5-"]],
              ["震度 5+", palette["5+"]],
              ["震度 6-", palette["6-"]],
              ["震度 6+", palette["6+"]],
              ["震度 7-", palette["7-"]],
              ["震度 7+", palette["7+"]]
            ].map(([label, color]) => `
              <div class="row">
                <span class="swatch" style="background:${color};"></span>
                <span>${label}</span>
              </div>
            `).join("")}
          `;
        }
        return el;
      };
      legendCtrl.addTo(map);
    }

    function pickEarthquakeArray(records){
      const arr = records?.Earthquake;
      return Array.isArray(arr) ? arr : [];
    }

    function getOriginTime(eq){
      return eq?.EarthquakeInfo?.OriginTime ?? eq?.OriginTime ?? "";
    }

    /* 將 CWA 的 ISO 時間轉成一般閱讀格式，例如：2026-07-27 10:14:49 */
    function formatOriginTime(raw){
      const value = String(raw ?? "").trim();
      if(!value) return "—";

      const match = value.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2}))?/);
      if(match){
        return `${match[1]}-${match[2]}-${match[3]} ${match[4]}:${match[5]}:${match[6] || "00"}`;
      }

      const d = new Date(value);
      if(!Number.isNaN(d.getTime())){
        const parts = new Intl.DateTimeFormat("zh-TW", {
          timeZone:"Asia/Taipei",
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit",
          hour12:false
        }).formatToParts(d).reduce((acc, part) => {
          acc[part.type] = part.value;
          return acc;
        }, {});
        return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
      }

      return value.replace("T", " ").replace(/(?:Z|[+-]\d{2}:?\d{2})$/, "");
    }

    function getDisplayOriginTime(eq){
      return formatOriginTime(getOriginTime(eq));
    }

    function getMagnitude(eq){
      const mag = eq?.EarthquakeInfo?.EarthquakeMagnitude;
      const val = mag?.MagnitudeValue ?? mag?.Value ?? mag?.Magnitude;
      const n = Number(val);
      return Number.isFinite(n) ? n : null;
    }

    function getDepth(eq){
      const d = eq?.EarthquakeInfo?.FocalDepth ?? eq?.EarthquakeInfo?.Depth ?? eq?.FocalDepth;
      const n = Number(d);
      return Number.isFinite(n) ? n : null;
    }

    function getEpicenter(eq){
      const epic = eq?.EarthquakeInfo?.Epicenter ?? {};
      const lat = toNum(epic?.EpicenterLatitude ?? epic?.Latitude ?? epic?.Lat);
      const lon = toNum(epic?.EpicenterLongitude ?? epic?.Longitude ?? epic?.Lon ?? epic?.Lng);
      const location = epic?.Location ?? epic?.EpicenterLocation ?? "";
      return { lat, lon, location };
    }

    function getIntensityStations(eq){
      const areas = eq?.Intensity?.ShakingArea;
      if(!Array.isArray(areas)) return [];

      const stations = [];
      for(const a of areas){
        const county = a?.CountyName ?? a?.AreaDesc ?? "";
        const eqStations = a?.EqStation;
        if(Array.isArray(eqStations)){
          for(const s of eqStations){
            const name = s?.StationName ?? s?.Name ?? "";
            const lat = toNum(s?.StationLatitude ?? s?.Latitude ?? s?.Lat);
            const lon = toNum(s?.StationLongitude ?? s?.Longitude ?? s?.Lon ?? s?.Lng);
            if(lat == null || lon == null) continue;

            const raw = s?.StationIntensity ?? s?.Intensity ?? s?.SeismicIntensity ?? "";
            const norm = normalizeIntensityLabel(raw);

            stations.push({
              county,
              station:name,
              label:norm.label,
              bucket:norm.bucket,
              lat,
              lon
            });
          }
        }
      }
      return stations;
    }

    function makeEqKey(eq){
      const t = getOriginTime(eq) || "";
      const m = getMagnitude(eq);
      const e = getEpicenter(eq);
      return `${t}|${m ?? ""}|${e.lat ?? ""},${e.lon ?? ""}`;
    }

    function setTopCards({ time, mag, depth, maxLabel }){
      $("vTime").textContent = time || "—";
      $("vMag").textContent = (mag != null) ? `M${mag.toFixed(1)}` : "—";
      $("vDepth").textContent = (depth != null) ? `${depth.toFixed(1)} km` : "—";
      if(activeCountry === "malaysia"){
        $("vMaxInt").textContent = maxLabel || "—";
      }else{
        $("vMaxInt").textContent = (maxLabel != null) ? `震度 ${maxLabel}` : "—";
      }
    }

    function rankLabel(lab){
      if(lab === "7+") return 72;
      if(lab === "7-") return 71;
      if(lab === "7") return 70;
      if(lab === "6+") return 62;
      if(lab === "6-") return 61;
      if(lab === "6") return 60;
      if(lab === "5+") return 52;
      if(lab === "5-") return 51;
      if(lab === "5") return 50;
      const n = Number(lab);
      return Number.isFinite(n) ? n * 10 : 0;
    }

    function buildCountyMax(stations){
      const m = new Map();
      for(const s of stations){
        const k = (s.county || "").trim();
        if(!k) continue;
        const label = s.label ?? (s.bucket != null ? String(s.bucket) : null);
        const bucket = (s.bucket != null) ? s.bucket : -1;
        if(label == null) continue;

        const cur = m.get(k);
        if(!cur){
          m.set(k, { bucket, label });
        }else{
          if(bucket > cur.bucket) m.set(k, { bucket, label });
          else if(bucket === cur.bucket && rankLabel(label) > rankLabel(cur.label)) m.set(k, { bucket, label });
        }
      }
      return Array.from(m.entries())
        .map(([county, v]) => ({ county, bucket:v.bucket, label:v.label }))
        .sort((a,b) => (b.bucket - a.bucket) || rankLabel(b.label) - rankLabel(a.label) || a.county.localeCompare(b.county, "zh-Hant"));
    }

    function renderCountyGrid(stations){
      const grid = $("countyGrid");
      grid.innerHTML = "";

      if(activeCountry === "malaysia"){
        const rows = buildMalaysiaStateSummary();
        $("countyCount").textContent = `${rows.length} 筆`;
        $("heroCountyCount").textContent = rows.length;

        if(!rows.length){
          grid.innerHTML = `<div style="grid-column:1/-1;color:#6a7d89;font-weight:900;font-size:12px;">沒有州屬資料</div>`;
          return;
        }

        for(const r of rows){
          const color = getMalaysiaStateColor(r.state);
          const el = document.createElement("div");
          el.className = "countyItem";
          el.innerHTML = `
            <div class="countyName" title="${escapeHtml(r.state)}">${escapeHtml(r.state)}</div>
            <div class="countyInt">
              <span class="iDot" style="background:${color};"></span>
              ${r.count} 筆
            </div>
          `;
          el.title = r.maxMag != null ? `最大規模 M${r.maxMag.toFixed(1)}` : `${r.count} 筆`;
          grid.appendChild(el);

      }

      const rows = buildCountyMax(stations);
      $("countyCount").textContent = `${rows.length} 筆`;
      $("heroCountyCount").textContent = rows.length;

      if(!rows.length){
        const eq = cachedAll[currentIndex];
        if(eq?._kind === "malaysia" && eq?._state){
          $("countyCount").textContent = `1 筆`;
          $("heroCountyCount").textContent = 1;
          grid.innerHTML = `
            <div class="countyItem">
              <div class="countyName" title="${escapeHtml(eq._state)}">${escapeHtml(eq._state)}</div>
              <div class="countyInt">州屬</div>
            </div>`;
        }else{
          grid.innerHTML = `<div style="grid-column:1/-1;color:#6a7d89;font-weight:900;font-size:12px;">沒有縣市震度資料</div>`;
        }
        return;
      }

      for(const r of rows){
        const color = intensityColor(r.label, r.bucket);
        const el = document.createElement("div");
        el.className = "countyItem";
        el.innerHTML = `
          <div class="countyName" title="${escapeHtml(r.county)}">${escapeHtml(r.county)}</div>
          <div class="countyInt">

    function getMaxIntensityLabel(stations){
      if(!stations.length) return null;
      let best = null;
      for(const s of stations){
        const lab = s.label ?? (s.bucket != null ? String(s.bucket) : null);
        if(!lab) continue;
        if(!best || rankLabel(lab) > rankLabel(best)) best = lab;
      }
      return best;
    }

    function getKindLabel(eq, { short=false } = {}){
      if(eq?._kind === "malaysia") return short ? "馬來西亞" : "馬來西亞地震";
      if(eq?._kind === "local") return short ? "小區域" : "小區域地震";
      return short ? "顯著" : "顯著有感地震";

    function clearLayers(){

    function getAdaptiveMapView(stations, epi, maxLabel, { exportMode=false } = {}){
      const maxRank = rankLabel(maxLabel);
      const maxBucket = Math.floor(maxRank / 10);

      /*
       * 只使用較明顯震度的測站計算主要視野，避免遠端震度 1 測站
       * 把整個台灣縮得太小；所有測站仍然會繪製在地圖上。
       */
      let threshold = 1;
      if(maxBucket >= 5) threshold = 3;
      else if(maxBucket >= 4) threshold = 2;
      else if(maxBucket >= 3) threshold = 2;
      else if(maxBucket >= 2) threshold = 1;
      else threshold = 0;

      let focusStations = stations.filter(s => (s.bucket ?? 0) >= threshold);
      if(focusStations.length < 3){
        focusStations = stations.slice();
      }

      const points = focusStations.map(s => [s.lat, s.lon]);
      if(epi?.lat != null && epi?.lon != null) points.push([epi.lat, epi.lon]);

      const minZoom = exportMode
        ? (maxBucket >= 5 ? 8.35 : maxBucket >= 4 ? 8.15 : maxBucket >= 3 ? 7.95 : maxBucket >= 2 ? 7.65 : 7.25)
        : (maxBucket >= 5 ? 8.05 : maxBucket >= 4 ? 7.85 : maxBucket >= 3 ? 7.65 : maxBucket >= 2 ? 7.35 : 7.05);

      const maxZoom = exportMode ? 9.15 : 8.85;
      const padding = exportMode ? [70, 70] : [75, 75];

      return { points, minZoom, maxZoom, padding };
    }

    function applyAdaptiveMapView(stations, epi, maxLabel, { exportMode=false } = {}){
      const view = getAdaptiveMapView(stations, epi, maxLabel, { exportMode });

      if(view.points.length >= 2){
        map.fitBounds(L.latLngBounds(view.points), {
          padding:view.padding,
          maxZoom:view.maxZoom,
          animate:false
        });
        const fittedZoom = map.getZoom();
        if(fittedZoom < view.minZoom){
          map.setZoom(view.minZoom, { animate:false });
        }
      }else if(view.points.length === 1){
        map.setView(view.points[0], view.minZoom, { animate:false });
      }else{
        if(activeCountry === "malaysia") map.setView([4.2, 102.0], 6, { animate:false });
        else map.setView([23.7, 121.0], 7.2, { animate:false });
      }
    }

                <span style="display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.10);background:#fff;font-weight:900;font-size:12px;">
                  <span style="width:10px;height:10px;border-radius:999px;background:${color};display:inline-block;"></span>
                  <span>${escapeHtml(state)}</span>
                </span>
                <span style="display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:rgba(15,76,92,.08);font-weight:900;font-size:12px;color:#0f4c5c;">M${itemMag != null ? itemMag.toFixed(1) : "—"}</span>
              </div>
              <div style="font-size:12px;font-weight:900;color:#374151;line-height:1.6;">
                <div>類型：馬來西亞地震</div>
                <div>時間：${escapeHtml(getDisplayOriginTime(item) || "-")}</div>
                <div>位置：${escapeHtml(itemEpi.location || "-")}</div>
                <div>州屬：${escapeHtml(state)}</div>
                <div>座標：${itemEpi.lat.toFixed(3)}, ${itemEpi.lon.toFixed(3)}</div>
                <div>規模：${itemMag != null ? itemMag.toFixed(1) : "-"}</div>
                <div>深度：${(getDepth(item) != null) ? getDepth(item).toFixed(1) + " km" : "-"}</div>

          mk.on("click", () => {

        if(points.length >= 2){
          map.fitBounds(L.latLngBounds(points), {

            animate:false

          map.setView(points[0], 7, { animate:false });
        }else{
          map.setView([4.2, 102.0], 6, { animate:false });

        setTimeout(() => map.invalidateSize(), 80);
        return;
      }

      if(epi.lat != null && epi.lon != null){
        /* 震央固定使用原本紅色樣式，不跟 M pill 顏色走 */
        const epiColor = "#d62828";
        const epiSize = 20;
        const html = `<div class="epi" style="width:${epiSize}px;height:${epiSize}px;background:${epiColor};box-shadow:0 0 0 10px rgba(214,40,40,.16), 0 0 0 22px rgba(214,40,40,.10), 0 12px 26px rgba(214,40,40,.30);" title="震央"></div>`;
        epicenterMarker = L.marker([epi.lat, epi.lon], {
          icon:L.divIcon({ className:"", html, iconSize:[epiSize,epiSize], iconAnchor:[epiSize/2,epiSize/2] }),
          zIndexOffset: 10000
        }).addTo(map);

        epicenterMarker.setZIndexOffset(10000);

        const epiPopup = `
          <div style="min-width:260px;">

              <div>類型：${escapeHtml(getKindLabel(eq))}</div>
              <div>時間：${escapeHtml(time || "-")}</div>
              <div>位置：${escapeHtml(epi.location || "-")}</div>
              <div>座標：${epi.lat.toFixed(2)}, ${epi.lon.toFixed(2)}</div>
              <div>規模：${mag != null ? mag.toFixed(1) : "-"}</div>

            </div>

        `;
        epicenterMarker.bindPopup(epiPopup, { maxWidth:420 });
      }

      const showStations = $("toggleStations")?.checked !== false;
      if(showStations && stations.length){
        /* 互動式地圖的測站點固定維持 26px；只有輸出 PNG 時才會暫時縮小。 */
        const stationSize = 26;

        for(const s of stations){
          const label = s.label ?? (s.bucket != null ? String(s.bucket) : "—");
          const color = intensityColor(label, s.bucket);

          const html = `
            <div class="stn" style="border-color:${color};" title="震度 ${escapeHtml(label)}">
              ${escapeHtml(label)}
            </div>
          `;

          const mk = L.marker([s.lat, s.lon], {
            icon:L.divIcon({
              className:"",
              html,
              iconSize:[26,26],
              iconAnchor:[13,13]
            }),
            zIndexOffset: 0
          }).addTo(map);

          const popup = `
            <div style="min-width:240px;">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                <span style="display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.10);background:#fff;font-weight:900;font-size:12px;">
                  <span style="width:10px;height:10px;border-radius:999px;background:${color};display:inline-block;"></span>
                  <span>震度 ${escapeHtml(label)}</span>
                </span>
              </div>
              <div style="font-size:12px;font-weight:900;color:#374151;line-height:1.6;">
                <div>縣市：${escapeHtml(s.county || "-")}</div>
                <div>測站：${escapeHtml(s.station || "-")}</div>
                <div>座標：${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</div>
              </div>

          mk.bindPopup(popup, { maxWidth:420 });
          stationMarkers.push(mk);

      applyAdaptiveMapView(stations, epi, maxLabel, { exportMode:false });

      setTimeout(() => map.invalidateSize(), 80);
    }

    function renderCurrent(opts){
      const eq = cachedAll[currentIndex];
      if(!eq) return;
      renderEarthquake(eq, opts);
    }

    async function fetchOne(datasetId, limit = 20){
      const url = `${API_BASE}${datasetId}?Authorization=${encodeURIComponent(CWA_AUTH)}&format=JSON&limit=${limit}`;
      const res = await fetch(url, { cache:"no-store" });
      if(!res.ok) throw new Error(`API 失敗：HTTP ${res.status}`);
      const data = await res.json();
      return pickEarthquakeArray(data?.records);
    }

    async function fetchMerged(limitEach = 20){
      const [sig, loc] = await Promise.all([
        fetchOne(DATASET_SIGNIFICANT, limitEach),
        fetchOne(DATASET_LOCAL, limitEach)
      ]);
      const sig2 = sig.map(x => ({ ...x, _kind:"significant" }));
      const loc2 = loc.map(x => ({ ...x, _kind:"local" }));
      const all = [...sig2, ...loc2].filter(Boolean);
      all.sort((a,b) => (getOriginTime(b) || "").localeCompare(getOriginTime(a) || ""));
      return all;
    }

    function excelDateToLocalString(value){
      if(value instanceof Date && !Number.isNaN(value.getTime())){
        const pad = n => String(n).padStart(2, "0");
        return `${value.getFullYear()}-${pad(value.getMonth()+1)}-${pad(value.getDate())} ${pad(value.getHours())}:${pad(value.getMinutes())}:${pad(value.getSeconds())}`;
      }
      if(typeof value === "number" && window.XLSX?.SSF?.parse_date_code){
        const d = XLSX.SSF.parse_date_code(value);
        if(d){
          const pad = n => String(n).padStart(2, "0");
          return `${d.y}-${pad(d.m)}-${pad(d.d)} ${pad(d.H)}:${pad(d.M)}:${pad(Math.floor(d.S || 0))}`;
        }
      }
      return String(value ?? "").trim();
    }

    async function fetchMalaysiaEarthquakes(){
      if(!window.XLSX) throw new Error("SheetJS 尚未載入，無法讀取 Malaysia Excel");

      const sep = MALAYSIA_XLSX_PATH.includes("?") ? "&" : "?";
      const res = await fetch(`${MALAYSIA_XLSX_PATH}${sep}t=${Date.now()}`, { cache:"no-store" });
      if(!res.ok) throw new Error(`Malaysia Excel 讀取失敗：HTTP ${res.status}`);

      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array", cellDates:true });
      const sheetName = wb.SheetNames.includes("Sheet2") ? "Sheet2" : wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:null });

      return rows.map((r, idx) => {
        const time = excelDateToLocalString(r["地震時間"]);
        const lon = toNum(r["經度"]);
        const lat = toNum(r["緯度"]);
        const mag = toNum(r["規模"]);
        const depth = toNum(r["深度"]);
        const location = String(r["位置"] ?? "").trim();
        const state = String(r["州屬"] ?? "").trim();

        if(!time || lat == null || lon == null) return null;

        return {
          _kind:"malaysia",
          _state:state,
          _sourceNo:r["編號"] ?? (idx + 1),
          EarthquakeInfo:{
            OriginTime:time,
            FocalDepth:depth,
            EarthquakeMagnitude:{ MagnitudeValue:mag },
            Epicenter:{
              EpicenterLatitude:lat,
              EpicenterLongitude:lon,
              Location:location || state || "Malaysia"
            }
          },
          Intensity:{ ShakingArea:[] }
        };
      }).filter(Boolean);
    }

    async function fetchAllEarthquakes(limitEach = 20){
      const results = await Promise.allSettled([
        fetchMerged(limitEach),
        fetchMalaysiaEarthquakes()
      ]);

      const tw = results[0].status === "fulfilled" ? results[0].value : [];
      const my = results[1].status === "fulfilled" ? results[1].value : [];

      if(results[0].status === "rejected") console.warn("CWA data failed:", results[0].reason);
      if(results[1].status === "rejected") console.warn("Malaysia Excel failed:", results[1].reason);
      if(!tw.length && !my.length) throw new Error("台灣與馬來西亞地震資料皆無法讀取");

      tw.sort((a,b) => (getOriginTime(b) || "").localeCompare(getOriginTime(a) || ""));
      my.sort((a,b) => (getOriginTime(b) || "").localeCompare(getOriginTime(a) || ""));
      return { taiwan:tw, malaysia:my };
    }

    function nowHHMMSS(){
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function setAutoStatusNext(sec){
      if(sec == null){
        $("autoStatus").textContent = "下次更新：—";
        return;
      }
      $("autoStatus").textContent = `下次更新：${sec}s（${nowHHMMSS()}）`;
    }

    async function refresh({ silent=false } = {}){
      if(!silent){
        $("refreshBtn").disabled = true;
        $("refreshBtn").textContent = "更新中…";
      }

      try{
        const groups = await fetchAllEarthquakes(20);
        cachedTaiwan = groups.taiwan || [];
        cachedMalaysia = groups.malaysia || [];
        cachedAll = activeCountry === "malaysia" ? cachedMalaysia : cachedTaiwan;
        if(currentIndex >= cachedAll.length) currentIndex = 0;

        updateCountryUi();
        renderSidePanel();
        if(cachedAll.length) renderCurrent({ keepViewIfSame:true });
      }catch(err){
        console.error(err);
        if(!silent) alert("讀取地震資料失敗：\n" + (err?.message || err));
      }finally{
        if(!silent){
          $("refreshBtn").disabled = false;
          $("refreshBtn").textContent = "立即更新";
        }

    function startAuto(){
      stopAuto();
      let remaining = AUTO_REFRESH_SEC;
      setAutoStatusNext(remaining);

      nextTickTimer = setInterval(() => {
        remaining -= 1;
        if(remaining <= 0) remaining = AUTO_REFRESH_SEC;
        setAutoStatusNext(remaining);
      }, 1000);

      autoTimer = setInterval(() => {
        refresh({ silent:true });
      }, AUTO_REFRESH_SEC * 1000);
    }

    function stopAuto(){
      if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
      if(nextTickTimer){ clearInterval(nextTickTimer); nextTickTimer = null; }
      setAutoStatusNext(null);
    }


    /***********************
     * Export selected earthquake as PNG
     * 只新增輸出功能，不影響頁面原本地圖與資料顯示
     ***********************/
    function drawRoundRect(ctx, x, y, w, h, r){
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    function fillRoundRect(ctx, x, y, w, h, r, fill, stroke=null){
      drawRoundRect(ctx, x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
      if(stroke){
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines=2){
      const raw = String(text ?? '—');
      const chars = raw.split('');
      let line = '';
      const lines = [];
      for(const ch of chars){
        const test = line + ch;
        if(ctx.measureText(test).width > maxWidth && line){
          lines.push(line);
          line = ch;
          if(lines.length >= maxLines) break;
        }else{
          line = test;
        }
      }
      if(lines.length < maxLines && line) lines.push(line);
      if(lines.length === maxLines && raw.length > lines.join('').length){
        lines[maxLines - 1] = lines[maxLines - 1].slice(0, Math.max(0, lines[maxLines - 1].length - 1)) + '…';
      }
      lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
      return y + Math.max(1, lines.length) * lineHeight;
    }

    async function ensureHtml2Canvas(){
      if(window.html2canvas) return window.html2canvas;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('html2canvas 載入失敗'));
        document.head.appendChild(s);
      });
      return window.html2canvas;
    }

    async function exportSelectedPng(){
      const eq = cachedAll[currentIndex];
      if(!eq){ alert('目前沒有選中的地震資料'); return; }

      const btn = $("exportPngBtn");
      const oldText = btn ? btn.textContent : "";
      if(btn){
        btn.disabled = true;
        btn.textContent = "輸出中…";
      }

      let restoreMap = null;

      try{
        const stations = getIntensityStations(eq);
        const countyRows = activeCountry === "malaysia"
          ? buildMalaysiaStateSummary().slice(0, 12).map(r => ({ county:r.state, label:`${r.count} 筆`, bucket:null, _color:getMalaysiaStateColor(r.state) }))
          : buildCountyMax(stations).slice(0, 12);
        const epi = getEpicenter(eq);
        const mag = getMagnitude(eq);
        const depth = getDepth(eq);
        const time = getDisplayOriginTime(eq);
        const maxLabel = activeCountry === 'malaysia' ? (eq?._state || '—') : (getMaxIntensityLabel(stations) || '—');
        const reportType = eq?._kind === 'malaysia' ? '馬來西亞地震資料' : (eq?._kind === 'local' ? '小區域地震報告' : '顯著有感地震報告');

        const W = 1600;
        const H = 900;
        const EXPORT_SCALE = 2;
        const EXPORT_MAP_W = 1200;
        const EXPORT_MAP_H = 798;

        const mapEl = $("map");
        const oldMapStyle = mapEl.getAttribute("style") || "";
        const oldCenter = map.getCenter();
        const oldZoom = map.getZoom();

        const hiddenEls = Array.from(mapEl.querySelectorAll(
          ".leaflet-control-zoom, .leaflet-control-attribution, .legend"
        ));
        const oldDisplay = hiddenEls.map(el => el.style.display);

        const stationEls = Array.from(mapEl.querySelectorAll('.stn'));
        const stationOldStyles = stationEls.map(el => el.getAttribute('style') || '');

        restoreMap = () => {
          hiddenEls.forEach((el, i) => el.style.display = oldDisplay[i]);
          stationEls.forEach((el, i) => {
            if(stationOldStyles[i]) el.setAttribute('style', stationOldStyles[i]);
            else el.removeAttribute('style');
          });
          if(oldMapStyle) mapEl.setAttribute("style", oldMapStyle);
          else mapEl.removeAttribute("style");
          map.invalidateSize(false);
          map.setView(oldCenter, oldZoom, { animate:false });
        };

        mapEl.style.position = "fixed";
        mapEl.style.left = "-12000px";
        mapEl.style.top = "0";
        mapEl.style.width = `${EXPORT_MAP_W}px`;
        mapEl.style.height = `${EXPORT_MAP_H}px`;
        mapEl.style.zIndex = "-9999";
        map.invalidateSize(false);

        /*
         * PNG 必須完整顯示所有震度測站：
         * 直接使用全部測站與震央計算 bounds，不再只取主要有感區，
         * 也不再套用最低 zoom，避免外圍震度 1／2 測站被裁掉。
         */
        const exportPoints = (activeCountry === "malaysia" && eq?._kind === "malaysia")
          ? cachedMalaysia
              .map(item => {
                const p = getEpicenter(item);
                return (p.lat != null && p.lon != null) ? [p.lat, p.lon] : null;
              })
              .filter(Boolean)
          : stations
              .filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lon))
              .map(s => [s.lat, s.lon]);
        if(activeCountry !== "malaysia" && epi?.lat != null && epi?.lon != null){
          exportPoints.push([epi.lat, epi.lon]);
        }

        if(exportPoints.length >= 2){
          const exportBounds = L.latLngBounds(exportPoints);
          map.fitBounds(exportBounds, {
            paddingTopLeft:[82, 72],
            paddingBottomRight:[82, 72],
            maxZoom:9.0,
            animate:false
          });
        }else if(exportPoints.length === 1){
          map.setView(exportPoints[0], 8.0, { animate:false });
        }else{
          map.setView([23.7, 121.0], 7.0, { animate:false });
        }

        /* 等待 Leaflet 完成移動及底圖圖磚載入後才截圖。 */
        await new Promise(resolve => {
          let finished = false;
          const done = () => {
            if(finished) return;
            finished = true;
            resolve();
          };
          map.once('moveend', done);
          setTimeout(done, 1500);
        });
        await new Promise(r => setTimeout(r, 650));
        hiddenEls.forEach(el => el.style.display = "none");

        /* 只縮小輸出圖片中的測站點，不影響互動式地圖。 */
        const exportStationSize = stations.length > 180 ? 16
          : stations.length > 120 ? 18
          : stations.length > 80 ? 20
          : stations.length > 45 ? 22
          : 24;
        const exportStationFont = exportStationSize <= 16 ? 8.5
          : exportStationSize <= 18 ? 9.5
          : exportStationSize <= 20 ? 10.5
          : exportStationSize <= 22 ? 11.5
          : 12.5;
        const exportStationBorder = exportStationSize <= 18 ? 2.0 : 2.4;

        stationEls.forEach(el => {
          el.style.width = `${exportStationSize}px`;
          el.style.height = `${exportStationSize}px`;
          el.style.fontSize = `${exportStationFont}px`;
          el.style.borderWidth = `${exportStationBorder}px`;
          el.style.boxShadow = '0 4px 10px rgba(31,53,72,.12)';
        });

        const html2canvasLib = await ensureHtml2Canvas();
        const mapCanvas = await html2canvasLib(mapEl, {
          useCORS:true,
          allowTaint:false,
          backgroundColor:'#eaf7f9',
          width:EXPORT_MAP_W,
          height:EXPORT_MAP_H,
          scale:2,
          logging:false
        });

        restoreMap();
        restoreMap = null;

        const canvas = document.createElement('canvas');
        canvas.width = W * EXPORT_SCALE;
        canvas.height = H * EXPORT_SCALE;
        const ctx = canvas.getContext('2d');
        ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#dff3f4');
        bg.addColorStop(.55, '#edf8f9');
        bg.addColorStop(1, '#f8fbfc');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        const leftX = 48;
        const topY = 36;
        const leftW = 320;
        const gap = 24;
        const rightX = leftX + leftW + gap;
        const rightW = W - rightX - 48;
        const cardH = H - 72;

        fillRoundRect(ctx, leftX, topY, leftW, cardH, 26, 'rgba(255,255,255,.97)', 'rgba(25,42,58,.14)');
        fillRoundRect(ctx, rightX, topY, rightW, cardH, 26, 'rgba(255,255,255,.94)', 'rgba(25,42,58,.14)');

        /* 左側資訊卡 */
        ctx.fillStyle = '#0f4c5c';
        ctx.font = '900 26px "Noto Sans TC", sans-serif';
        ctx.fillText(reportType, leftX + 26, topY + 47);

        fillRoundRect(ctx, leftX + 24, topY + 66, leftW - 48, 84, 19,
          'rgba(15,76,92,.055)', 'rgba(15,76,92,.11)');
        ctx.fillStyle = '#0f4c5c';
        ctx.beginPath();
        ctx.arc(leftX + 50, topY + 102, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(leftX + 50, topY + 102, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#102f40';
        ctx.font = '900 17px "Noto Sans TC", sans-serif';
        wrapCanvasText(ctx, epi.location || '—', leftX + 70, topY + 93, leftW - 102, 22, 2);

        fillRoundRect(ctx, leftX + 24, topY + 160, leftW - 48, 44, 22,
          'rgba(42,157,143,.10)', 'rgba(42,157,143,.15)');
        ctx.strokeStyle = '#0f4c5c';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(leftX + 48, topY + 182, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(leftX + 48, topY + 182);
        ctx.lineTo(leftX + 48, topY + 176);
        ctx.moveTo(leftX + 48, topY + 182);
        ctx.lineTo(leftX + 54, topY + 186);
        ctx.stroke();
        ctx.fillStyle = '#102f40';
        ctx.font = '900 14px "Noto Sans TC", sans-serif';
        ctx.fillText(time, leftX + 67, topY + 188);

        const magY = topY + 224;
        fillRoundRect(ctx, leftX + 24, magY, leftW - 48, 84, 18,
          '#f7fbfc', 'rgba(25,42,58,.11)');
        ctx.fillStyle = magnitudeColor(mag);
        ctx.font = '900 34px "Noto Sans TC", sans-serif';
        ctx.fillText(mag != null ? `M${mag.toFixed(1)}` : 'M—', leftX + 45, magY + 54);
        ctx.fillStyle = '#102f40';
        ctx.font = '900 18px "Noto Sans TC", sans-serif';
        ctx.fillText(activeCountry === 'malaysia' ? `州屬 ${maxLabel || '—'}` : (maxLabel !== '—' ? `最大震度 ${maxLabel}` : '最大震度 —'), leftX + 138, magY + 50);

        const statGap = 10;
        const statW = (leftW - 48 - statGap) / 2;
        function statCard(label, value, x, y){
          fillRoundRect(ctx, x, y, statW, 62, 14, '#fff', 'rgba(25,42,58,.11)');
          ctx.fillStyle = '#6a7d89';
          ctx.font = '900 12px "Noto Sans TC", sans-serif';
          ctx.fillText(label, x + 14, y + 22);
          ctx.fillStyle = '#102f40';
          ctx.font = '900 15px "Noto Sans TC", sans-serif';
          ctx.fillText(value, x + 14, y + 48);
        }

        const statY = topY + 330;
        statCard('深度', depth != null ? `${depth.toFixed(1)} km` : '—', leftX + 24, statY);
        statCard('座標', (epi.lat != null && epi.lon != null)
          ? `${epi.lat.toFixed(2)}, ${epi.lon.toFixed(2)}` : '—', leftX + 24 + statW + statGap, statY);

        ctx.fillStyle = '#102f40';
        ctx.font = '900 17px "Noto Sans TC", sans-serif';
        ctx.fillText(activeCountry === 'malaysia' ? '州屬分布' : '各縣市最大震度', leftX + 24, topY + 425);

        const chipX1 = leftX + 24;
        const chipGap = 8;
        const chipW = (leftW - 48 - chipGap) / 2;
        const chipH = 34;
        countyRows.forEach((r, i) => {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const x = chipX1 + col * (chipW + chipGap);
          const y = topY + 446 + row * 42;
          const c = r._color || intensityColor(r.label, r.bucket);
          fillRoundRect(ctx, x, y, chipW, chipH, 17, '#fff', 'rgba(25,42,58,.12)');
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(x + 16, y + 17, 5.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#102f40';
          ctx.font = '800 10px "Noto Sans TC", sans-serif';
          wrapCanvasText(ctx, r._color ? `${r.county} ${r.label}` : `${r.county} 震度 ${r.label}`, x + 29, y + 22, chipW - 36, 12, 1);
        });

        ctx.strokeStyle = 'rgba(25,42,58,.10)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(leftX + 24, topY + cardH - 54);
        ctx.lineTo(leftX + leftW - 24, topY + cardH - 54);
        ctx.stroke();
        ctx.fillStyle = '#7a8d98';
        ctx.font = '800 11px "Noto Sans TC", sans-serif';
        ctx.fillText(`測站 ${stations.length} 個`, leftX + 24, topY + cardH - 27);
        ctx.textAlign = 'right';
        ctx.fillText('資料來源：中央氣象署', leftX + leftW - 24, topY + cardH - 27);
        ctx.textAlign = 'left';

        /* 右側地圖卡 */
        ctx.fillStyle = '#102f40';
        ctx.font = '900 26px "Noto Sans TC", sans-serif';
        ctx.fillText('震央與測站震度地圖', rightX + 28, topY + 45);

        const mapX = rightX + 28;
        const mapY = topY + 66;
        const mapW = rightW - 56;
        const mapH = cardH - 94;
        fillRoundRect(ctx, mapX, mapY, mapW, mapH, 22, '#e8f6f8', 'rgba(15,76,92,.16)');

        ctx.save();
        drawRoundRect(ctx, mapX, mapY, mapW, mapH, 22);
        ctx.clip();

        /*
         * 完整縮放地圖到 PNG 地圖框，不再使用 cover 裁切。
         * EXPORT_MAP_W / EXPORT_MAP_H 已與 PNG 地圖框比例一致，
         * 因此台灣、離島與主要震度範圍都會完整保留。
         */
        ctx.drawImage(mapCanvas, 0, 0, mapCanvas.width, mapCanvas.height,
          mapX, mapY, mapW, mapH);
        ctx.restore();

        /* PNG 專用直式圖例：保持與互動式地圖相同的左下角樣式。 */
        const pngLegendItems = [
          ['震度 0', palette[0]],
          ['震度 1', palette[1]],
          ['震度 2', palette[2]],
          ['震度 3', palette[3]],
          ['震度 4', palette[4]],
          ['震度 5-', palette['5-']],
          ['震度 5+', palette['5+']],
          ['震度 6-', palette['6-']],
          ['震度 6+', palette['6+']],
          ['震度 7-', palette['7-']],
          ['震度 7+', palette['7+']]
        ];
        const legendW = 112;
        const legendPadX = 14;
        const legendTopPad = 14;
        const legendTitleH = 22;
        const legendRowH = 26;
        const legendBottomPad = 12;
        const legendH = legendTopPad + legendTitleH + pngLegendItems.length * legendRowH + legendBottomPad;
        const legendX = mapX + 16;
        const legendY = mapY + mapH - legendH - 16;

        ctx.save();
        ctx.shadowColor = 'rgba(31,53,72,.15)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 7;
        fillRoundRect(ctx, legendX, legendY, legendW, legendH, 17,
          'rgba(255,255,255,.94)', 'rgba(25,42,58,.12)');
        ctx.restore();

        ctx.fillStyle = '#102f40';
        ctx.font = '900 13px "Noto Sans TC", sans-serif';
        ctx.fillText('圖例', legendX + legendPadX, legendY + 24);

        pngLegendItems.forEach(([label, color], i) => {
          const cy = legendY + legendTopPad + legendTitleH + i * legendRowH + legendRowH / 2;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(legendX + legendPadX + 7, cy, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#102f40';
          ctx.font = '900 12px "Noto Sans TC", sans-serif';
          ctx.fillText(label, legendX + legendPadX + 22, cy + 4);
        });

        const footW = 238;
        const footH = 50;
        const footX = mapX + mapW - footW - 16;
        const footY = mapY + mapH - footH - 16;
        fillRoundRect(ctx, footX, footY, footW, footH, 18,
          'rgba(255,255,255,.91)', 'rgba(25,42,58,.14)');

        const logoX = footX + 25;
        const logoY = footY + 25;
        ctx.strokeStyle = '#0f4c5c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(logoX, logoY, 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(logoX, logoY, 5.5, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#0f4c5c';
        ctx.font = '900 15px "Noto Sans TC", sans-serif';
        ctx.fillText('筱風製作', footX + 46, footY + 21);
        ctx.fillStyle = '#6a7d89';
        ctx.font = '800 12px "Noto Sans TC", sans-serif';
        ctx.fillText(eq?._kind === 'malaysia' ? '資料來源 Malaysia Earthquake Dataset' : '資料來源 CWA', footX + 46, footY + 38);

        const a = document.createElement('a');
        const safeTime = time.replace(/[^0-9]/g, '').slice(0, 12) || 'earthquake';
        a.download = `earthquake_${safeTime}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      }catch(err){
        if(restoreMap){
          try{ restoreMap(); }catch(_){}
        }
        console.error(err);
        alert('PNG 輸出失敗：' + (err?.message || err));
      }finally{
        if(btn){
          btn.disabled = false;
          btn.textContent = oldText || "列印 PNG";
        }
      }
    }

    function init(){
      map = L.map("map", { zoomControl:true });

      const mb = L.tileLayer(
        `https://api.mapbox.com/styles/v1/${MAPBOX_STYLE}/tiles/512/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`,
        { tileSize:512, zoomOffset:-1, maxZoom:18, attribution:"© Mapbox © OpenStreetMap" }
      );

      mb.on("tileerror", () => {
        console.warn("Mapbox tiles 載入失敗，切換到 OSM。");
        if(map.hasLayer(mb)) map.removeLayer(mb);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom:19,
          attribution:"© OpenStreetMap"
        }).addTo(map);
      });

      mb.addTo(map);
      map.setView([23.7, 121.0], 7);
      buildLegend();
      updateCountryUi();

      $("refreshBtn").addEventListener("click", () => refresh({ silent:false }));
      $("exportPngBtn").addEventListener("click", exportSelectedPng);
      $("heroRefreshBtn").addEventListener("click", () => refresh({ silent:false }));
      $("tabTaiwan").addEventListener("click", () => switchCountry("taiwan"));
      $("tabMalaysia").addEventListener("click", () => switchCountry("malaysia"));

      $("toggleStations").addEventListener("change", () => {
        lastRenderedKey = "";
        renderCurrent({ keepViewIfSame:false });
      });

      $("eqSelect").addEventListener("change", (e) => {
        currentIndex = Number(e.target.value) || 0;
        lastRenderedKey = "";
        renderCurrent({ keepViewIfSame:false });
      });

      $("toggleAuto").addEventListener("change", (e) => {
        if(e.target.checked) startAuto();
        else stopAuto();
      });

      refresh({ silent:true }).then(() => {
        lastRenderedKey = "";
        renderCurrent({ keepViewIfSame:false });
      });

      if($("toggleAuto").checked) startAuto();

      setTimeout(() => map.invalidateSize(), 250);
      setTimeout(() => map.invalidateSize(), 900);
    }

    window.addEventListener("load", init);
  </script>
<script>
(async () => {
  const box = document.getElementById("siteAnnouncement");
  if(!box) return;

  function escapeHtml(text){
    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function parseBold(text){
    return escapeHtml(text).replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  }

  try{
    const res = await fetch("/WhereWindMeet/data/announcement.json?t=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw new Error(`公告資料載入失敗：HTTP ${res.status}`);

    const data = await res.json();
    const announcements = Array.isArray(data.announcements) ? data.announcements : [];

    if(!data.enabled || !announcements.length){
      box.remove();
      return;
    }

    let current = 0;
    let timer = null;

    function render(index){
      const item = announcements[index] || {};
      const text = item.text || item.content || item.message || "";

      box.innerHTML = `
        <div class="announcementBar">
          <div class="announcementIcon" aria-hidden="true">📢</div>

          <div class="announcementContent">
            <div class="announcementTitle">${escapeHtml(item.title || "重要公告")}</div>

            ${item.pill ? `
              <div class="announcementPill">${escapeHtml(item.pill)}</div>
            ` : ""}

            <div class="announcementText">${parseBold(text)}</div>

            ${item.updated ? `
              <div class="announcementTime">更新時間：${escapeHtml(item.updated)}</div>
            ` : ""}
          </div>

          ${announcements.length > 1 ? `
            <div class="announcementControls" aria-label="公告切換">
              <button class="announcementArrow" id="annPrev" type="button" aria-label="上一則公告">‹</button>
              <button class="announcementArrow" id="annNext" type="button" aria-label="下一則公告">›</button>
            </div>

            <div class="announcementDots" aria-label="公告頁面">
              ${announcements.map((_, i) => `
                <button
                  class="announcementDot ${i === current ? "active" : ""}"
                  data-index="${i}"
                  type="button"
                  aria-label="查看第 ${i + 1} 則公告"
                ></button>
              `).join("")}
            </div>
          ` : ""}
        </div>
      `;

      box.querySelector("#annPrev")?.addEventListener("click", () => manualGo(current - 1));
      box.querySelector("#annNext")?.addEventListener("click", () => manualGo(current + 1));
      box.querySelectorAll(".announcementDot").forEach(dot => {
        dot.addEventListener("click", () => manualGo(Number(dot.dataset.index)));
      });
    }

    function go(index){
      current = (index + announcements.length) % announcements.length;
      render(current);
    }

    function restartTimer(){
      if(timer) clearInterval(timer);
      if(announcements.length > 1){
        timer = setInterval(() => go(current + 1), 5000);
      }
    }

    function manualGo(index){
      go(index);
      restartTimer();
    }

    render(current);
    restartTimer();
  }catch(error){
    console.error("Announcement error:", error);
    box.remove();
  }
})();
</script>
</body>
</html>
