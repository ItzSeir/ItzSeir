<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>颱風預測</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --shadow: 0 2px 4px 5px rgba(77, 89, 95, 0.19);
      --card-bg: rgba(255,255,255,0.92);
      --blur: blur(6px);
      --muted: #6b7280;
      --ink: #111;
    }
    *{ box-sizing: border-box; }

    html, body{ height: 100%; overflow: visible; }
    body{
      margin:0;
      font-family:"Noto Sans TC","Segoe UI",Arial,sans-serif;
      background: transparent;
      color: var(--ink);
      padding: 18px 0;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 14px;
      overflow-x: hidden;
    }

    .panel{
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow), 0 0 0 1px rgba(0,0,0,.06) inset;
      overflow: hidden;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content: space-between; }
    .titleRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex: 1 1 auto; min-width: 240px; }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-weight:900; font-size:12px;
      width: fit-content; white-space:nowrap;
    }

    .title{ font-weight: 900; font-size: 18px; color: var(--ink); }
    .dot{ width:10px;height:10px;border-radius:999px; display:inline-block; background:#ef4444; }

    .btn{
      height: 42px; padding: 0 14px; border-radius: 14px;
      border: 1px solid rgba(0,0,0,.10); background:#fff;
      font-weight: 900; cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 18px rgba(77,89,95,.14); }

    .sub{ margin-top: 6px; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.6; }

    .infoBar{ margin-top: 12px; display:grid; grid-template-columns: 1fr; gap: 10px; }
    .infoHead{ display:flex; align-items:center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .infoLeft{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }

    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-weight: 900; font-size: 12px;
      white-space: nowrap;
    }

    .miniMeta{ font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }

    .toggle{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-size:12px; font-weight:900;
      color:#111; user-select:none; cursor:pointer;
    }
    .toggle input{ accent-color: #111; }

    .infoGrid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ibox{
      background:#fff; border-radius: 14px;
      border: 1px solid rgba(0,0,0,.06); padding: 12px 12px;
      min-height: 64px; display:flex; flex-direction: column; justify-content: center;
    }
    .ival{ font-size: 20px; font-weight: 900; color:#111; line-height: 1.1; letter-spacing: .2px; }
    .ilabel{ margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
    @media (max-width: 900px){ .infoGrid{ grid-template-columns: repeat(2, 1fr); } }

    .fcstWrap{
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,.06); border-radius: 14px;
      padding: 10px; overflow: hidden;
    }
    .fcstTop{ display:flex; align-items:center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .fcstTitle{ display:flex; align-items:center; gap: 10px; font-weight: 900; font-size: 12px; color:#374151; }
    .chip{
      display:inline-flex; align-items:center; gap:8px; padding:6px 10px;
      border-radius:999px; border:1px solid rgba(0,0,0,.08);
      background:#fff; font-size:12px; font-weight:900; color:#111; white-space:nowrap;
    }
    .fcstList{
      display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding-bottom: 6px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    }
    .fcstList::-webkit-scrollbar{ height: 10px; }
    .fcstList::-webkit-scrollbar-thumb{ background: rgba(0,0,0,.12); border-radius: 999px; }

    .fcstCard{
      flex: 0 0 auto; width: 220px; background:#fff;
      border: 1px solid rgba(0,0,0,.06); border-radius: 14px;
      padding: 10px 10px; scroll-snap-align: start; cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .fcstCard:hover{ transform: translateY(-1px); box-shadow: 0 10px 24px rgba(77,89,95,.12); }

    .fcstRow1{ display:flex; justify-content: space-between; align-items:center; gap: 10px; margin-bottom: 6px; }
    .fcstTime{ font-weight: 900; font-size: 12px; color:#111; white-space: nowrap; }
    .fcstBadge{
      display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
      border-radius:999px; border:1px solid rgba(0,0,0,.08); background:#fff;
      font-size:12px; font-weight:900; white-space: nowrap;
    }
    .fcstKv{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; font-size: 12px; font-weight: 800; color:#374151; }
    .fcstKv .k{ color: var(--muted); font-weight: 900; }
    .fcstKv .v{ color:#111; font-weight: 900; }

    #map{
      margin-top: 12px;
      height: 600px;
      min-height: 460px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
      background: #fff;
      position: relative;
    }

    .popup-card{ min-width: 240px; }
    .popup-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 8px; }
    .popup-title{ font-weight: 900; color:#111; }
    .popup-badge{
      display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
      border-radius:999px; font-size:12px; font-weight:900;
      border:1px solid rgba(0,0,0,.08); background:#fff; white-space:nowrap;
    }
    .popup-kv{ display:grid; grid-template-columns: 70px 1fr; gap:6px 10px; font-size:12px; color:#374151; font-weight:700; }
    .popup-kv div:nth-child(odd){ color:#6b7280; font-weight:900; }
    /* 警戒標籤樣式 */
    .country-alert-label {
        background: #ff4757;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 12px;
        border: 1px solid white;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .tlabel{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,.08);
      font-size: 12px;
      font-weight: 900;
      color:#111;
      box-shadow: 0 8px 20px rgba(77,89,95,.10);
      white-space: nowrap;
      backdrop-filter: blur(4px);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .tlabel.dragging{
      cursor: grabbing;
      box-shadow: 0 12px 28px rgba(77,89,95,.18);
    }
    .tlabel .miniDot{
      width:9px;
      height:9px;
      border-radius:999px;
      display:inline-block;
      background:#111;
      flex: 0 0 auto;
    }
    .tlabel-wrap{ transform: translateY(-4px); }
    .tlabel.current{
      border: 2px solid rgba(83,106,184,.35);
      box-shadow: 0 10px 28px rgba(77,89,95,.16);
    }

    .leaflet-div-icon.ty-label-icon{
      background: transparent;
      border: none;
    }

    @media print{
      body{ padding: 0; }
      .btn, .toggle{ display:none !important; }
      .panel{ box-shadow:none !important; }
      #map{ height: 520px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <div class="titleRow">
          <span class="pill"><span class="dot"></span> 颱風情報</span>
          <div class="title" id="pageTitle">載入中...</div>
        </div>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label class="toggle" title="顯示/隱藏地圖時間標籤">
            <input type="checkbox" id="toggleLabels" checked>
            顯示時間
          </label>
          <label class="toggle" title="顯示/隱藏預報不確定性陰影帶（cone）">
            <input type="checkbox" id="toggleCone" checked>
            陰影帶
          </label>
          <label class="toggle" title="顯示/隱藏暴風圈（storm radius）">
            <input type="checkbox" id="toggleRings" checked>
            暴風圈
          </label>
          <button class="btn" id="fitAllBtn">顯示完整路徑</button>
          <button class="btn" id="printBtn">列印 / 匯出 PDF</button>
        </div>
      </div>

      <div class="sub" id="sourceText">
        <b>來源：載入中...</b><br>
      </div>

      <div class="infoBar">
        <div class="infoHead">
          <div class="infoLeft">
            <div class="badge">
              <span class="dot" id="levelDotObs"></span>
              <span id="levelTextObs">—</span>
            </div>
            <div class="miniMeta" id="infoTimeObs">時間：—</div>
          </div>
          <div class="miniMeta" id="infoNoteObs">—</div>
        </div>

        <div class="infoGrid" aria-label="obs-info-grid">
          <div class="ibox"><div class="ival" id="obsCoord">—</div><div class="ilabel">座標</div></div>
          <div class="ibox"><div class="ival" id="obsWind">—</div><div class="ilabel">風速</div></div>
          <div class="ibox"><div class="ival" id="obsPres">—</div><div class="ilabel">氣壓</div></div>
        </div>

        <div class="fcstWrap">
          <div class="fcstTop">
            <div class="fcstTitle">
              <span class="dot" style="background:#60a5fa;"></span>
              <span>預報（全部）</span>
            </div>
            <span class="chip" id="fcstCount">0 筆</span>
          </div>
          <div class="fcstList" id="fcstList" aria-label="forecast-list"></div>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const MAPBOX_TOKEN = "pk.eyJ1IjoiaXR6c2VpciIsImEiOiJja240bTE0ZXYxc2xqMm5tbng1ZDd0a3Y1In0.8z3D3HF0GTrWJXZ9YtVT8Q";
    const MAPBOX_STYLE = "itzseir/cmihg7ep200rk01qq5ypv03c3";

    let weatherMeta = { title: "颱風情報", source: "—" };
    let points = [];

    const levelStyle = {
      LOW: { color: "#6b7280", label: "低壓/殘餘 LOW" },
      TD:  { color: "#536ab8", label: "熱帶低壓 TD" },
      TS:  { color: "#22c55e", label: "輕度颱風 TS" },
      STS: { color: "#f59e0b", label: "輕度颱風 STS" },
      TY:  { color: "#ef4444", label: "中度颱風 TY" },
      STY: { color: "#7c3aed", label: "强烈颱風 STY" }
    };
    const monitorAreas = [
      // --- 密克羅尼西亞群島 (颱風發源地) ---
      { name: "密克羅尼西亞 (FSM)", lat: 6.9, lon: 158.2, range: 4.5 },
      { name: "帛琉 (Palau)", lat: 7.5, lon: 134.6, range: 2.0 },
      { name: "馬紹爾群島", lat: 7.1, lon: 171.2, range: 3.5 },
    
      // --- 美屬領地 (重要觀測點) ---
      { name: "關島 (Guam)", lat: 13.4, lon: 144.7, range: 1.5 },
      { name: "塞班/北馬里亞納", lat: 15.2, lon: 145.7, range: 2.0 },
    
      // --- 菲律賓 (熱門路徑) ---
      { name: "菲律賓 (呂宋島)", lat: 16.0, lon: 121.0, range: 4.0 },
      { name: "菲律賓 (維薩亞斯)", lat: 11.0, lon: 124.5, range: 3.5 },
    
      // --- 東亞地區 ---
      { name: "臺灣 (Taiwan)", lat: 23.7, lon: 121.0, range: 2.5 },
      { name: "沖繩/琉球群島", lat: 26.3, lon: 127.8, range: 2.0 },
      { name: "日本 (本州)", lat: 35.0, lon: 139.0, range: 4.0 },
      { name: "日本 (九州)", lat: 32.6, lon: 130.8, range: 2.5 },
      { name: "韓國 (Jeju/Busan)", lat: 34.5, lon: 128.0, range: 3.0 },
    
      // --- 中國沿海與南海 ---
      { name: "華東沿海 (上海/浙江)", lat: 29.0, lon: 122.0, range: 3.5 },
      { name: "華南沿海 (廣東/香港)", lat: 22.5, lon: 114.1, range: 3.0 },
      { name: "海南島", lat: 19.1, lon: 109.7, range: 2.5 },
      { name: "越南沿海", lat: 16.0, lon: 108.2, range: 3.5 }
    ];
    function $(id){ return document.getElementById(id); }

    function getStyle(level){
      return levelStyle[level] || { color:"#111827", label: level || "Unknown" };
    }

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m]));
    }

    function kindLabel(kind){
      return kind === "fcst" ? "預報" : "歷史";
    }

    function parseLocalDateTime(s){
      const m = String(s ?? "").trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\s+(\d{1,2}):(\d{2})$/);
      if(!m) return null;
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5]), 0, 0);
    }

    function pad2(n){ return String(n).padStart(2, "0"); }

    function fmtTime(s, mode="full"){
      const dt = parseLocalDateTime(s);
      if(!dt) return String(s ?? "—");
      const Y = dt.getFullYear();
      const M = dt.getMonth() + 1;
      const D = dt.getDate();
      const hh = pad2(dt.getHours());
      const mm = pad2(dt.getMinutes());
      if(mode === "short") return `${M}/${D} ${hh}:${mm}`;
      return `${Y}-${pad2(M)}-${pad2(D)} ${hh}:${mm}`;
    }

    function fmtWindMs(ms){
      if(ms == null || !isFinite(ms)) return "—";
      return `${ms} m/s`;
    }

    async function loadWeatherData(){
      const res = await fetch("./weather.json");
      if(!res.ok) throw new Error(`Failed to load weather.json: ${res.status}`);
      const data = await res.json();

      weatherMeta.title = data.title || "颱風情報";
      weatherMeta.source = data.source || "—";

      points = (Array.isArray(data.points) ? data.points : []).map(p => ({
        lat: Number(p.lat),
        lon: Number(p.lon),
        time: String(p.time ?? ""),
        kind: String(p.kind ?? ""),
        level: String(p.level ?? ""),
        wind: p.wind === null || p.wind === undefined || p.wind === "" ? null : Number(p.wind),
        pressure: p.pressure === null || p.pressure === undefined || p.pressure === "" ? null : Number(p.pressure),
        note: String(p.note ?? ""),
        fcst_radius_km: p.fcst_radius_km === null || p.fcst_radius_km === undefined || p.fcst_radius_km === "" ? 0 : Number(p.fcst_radius_km),
        storm_radius_km: p.storm_radius_km === null || p.storm_radius_km === undefined || p.storm_radius_km === "" ? 0 : Number(p.storm_radius_km)
      })).filter(p => isFinite(p.lat) && isFinite(p.lon));

      $("pageTitle").textContent = weatherMeta.title;
      $("sourceText").innerHTML = `<b>來源：${escapeHtml(weatherMeta.source)}</b><br>`;
    }

    function popupHtml(p){
      const st = getStyle(p.level);
      const sr = (typeof p.storm_radius_km === "number" && p.storm_radius_km > 0) ? `${p.storm_radius_km} km` : "—";
      return `
        <div class="popup-card">
          <div class="popup-head">
            <div class="popup-title">${escapeHtml(kindLabel(p.kind))}</div>
            <span class="popup-badge" style="border-color:${st.color}33;">
              <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:${st.color};"></span>
              ${escapeHtml(st.label)}
            </span>
          </div>
          <div class="popup-kv">
            <div>時間</div><div>${escapeHtml(fmtTime(p.time,"full"))}</div>
            <div>座標</div><div>${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}</div>
            <div>風速</div><div>${escapeHtml(fmtWindMs(p.wind))}</div>
            <div>氣壓</div><div>${p.pressure ? escapeHtml(p.pressure + " hPa") : "-"}</div>
            <div>暴風圈</div><div>${escapeHtml(sr)}</div>
            <div>備註</div><div>${escapeHtml(p.note || "-")}</div>
          </div>
        </div>
      `;
    }

    function getLatestObsIndex(){
      for(let i = points.length - 1; i >= 0; i--){
        if(points[i].kind === "obs") return i;
      }
      return 0;
    }

    function setObsTopInfo(p){
      const st = getStyle(p.level);
      $("levelDotObs").style.background = st.color;
      $("levelTextObs").textContent = st.label;
      $("infoTimeObs").textContent = `時間：${fmtTime(p.time,"full")}`;
      $("infoNoteObs").textContent = (p.note && p.note.trim()) ? `備註：${p.note}` : "—";
      $("obsCoord").textContent = `${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}`;
      $("obsWind").textContent = fmtWindMs(p.wind);
      $("obsPres").textContent = p.pressure ? `${p.pressure} hPa` : "—";
    }

    function toRad(d){ return d * Math.PI / 180; }
    function toDeg(r){ return r * 180 / Math.PI; }
    function kmToMeters(km){ return km * 1000; }

    function bearingDegrees(lat1, lon1, lat2, lon2){
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function destinationPoint(lat, lon, bearingDeg, distanceMeters){
      const R = 6371e3;
      const δ = distanceMeters / R;
      const θ = toRad(bearingDeg);
      const φ1 = toRad(lat);
      const λ1 = toRad(lon);
      const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ) - Math.sin(φ1)*Math.sin(φ2));
      return { lat: toDeg(φ2), lon: ((toDeg(λ2) + 540) % 360) - 180 };
    }

    function avgAngleDeg(a, b){
      const ax = Math.cos(toRad(a)), ay = Math.sin(toRad(a));
      const bx = Math.cos(toRad(b)), by = Math.sin(toRad(b));
      const x = ax + bx, y = ay + by;
      if(Math.abs(x) < 1e-9 && Math.abs(y) < 1e-9) return a;
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function buildForecastConePolygonSmooth(){
      const latestObsIdx = getLatestObsIndex();
      const obs = points[latestObsIdx];
      const fcst = points.filter(p => p.kind === "fcst");

      if(!obs || fcst.length < 2) return null;

      function clamp(v, lo, hi){
        return Math.max(lo, Math.min(hi, v));
      }

      const rawRadii = fcst.map(p => clamp(Number(p.fcst_radius_km || 0), 0, 350));
      const firstForecastRadius = rawRadii[0] || 30;
      const START_RADIUS = clamp(firstForecastRadius * 0.38, 12, 120);

      const smoothRadii = rawRadii.map((r, i) => {
        if(i === 0) return clamp((START_RADIUS + r) / 2, 8, 350);

        const prev = rawRadii[i - 1];
        const next = rawRadii[i + 1] ?? r;
        return clamp((prev + r + next) / 3, 8, 350);
      });

      const path = [
        { lat: obs.lat, lon: obs.lon, rKm: START_RADIUS },
        ...fcst.map((p, i) => ({
          lat: p.lat,
          lon: p.lon,
          rKm: smoothRadii[i]
        }))
      ];

      function getHeading(i){
        if(i === 0){
          return bearingDegrees(path[0].lat, path[0].lon, path[1].lat, path[1].lon);
        }
        if(i === path.length - 1){
          return bearingDegrees(path[i - 1].lat, path[i - 1].lon, path[i].lat, path[i].lon);
        }

        const b1 = bearingDegrees(path[i - 1].lat, path[i - 1].lon, path[i].lat, path[i].lon);
        const b2 = bearingDegrees(path[i].lat, path[i].lon, path[i + 1].lat, path[i + 1].lon);
        return avgAngleDeg(b1, b2);
      }

      const leftSide = [];
      const rightSide = [];

      for(let i = 0; i < path.length; i++){
        const p = path[i];
        const heading = getHeading(i);
        const rMeters = kmToMeters(p.rKm);

        const leftPt = destinationPoint(p.lat, p.lon, (heading - 90 + 360) % 360, rMeters);
        const rightPt = destinationPoint(p.lat, p.lon, (heading + 90) % 360, rMeters);

        leftSide.push([leftPt.lat, leftPt.lon]);
        rightSide.push([rightPt.lat, rightPt.lon]);
      }

      const start = path[0];
      const startHeading = getHeading(0);
      const startRadius = kmToMeters(start.rKm);
      const startArc = [];
      for(let a = 90; a <= 270; a += 8){
        const pt = destinationPoint(start.lat, start.lon, (startHeading + a + 360) % 360, startRadius);
        startArc.push([pt.lat, pt.lon]);
      }

      const end = path[path.length - 1];
      const endHeading = getHeading(path.length - 1);
      const endRadius = kmToMeters(end.rKm);
      const endArc = [];
      for(let a = -90; a <= 90; a += 4){
        const pt = destinationPoint(end.lat, end.lon, (endHeading + a + 360) % 360, endRadius);
        endArc.push([pt.lat, pt.lon]);
      }

      return [
        ...startArc,
        ...leftSide.slice(1),
        ...endArc,
        ...rightSide.slice(1).reverse(),
        startArc[0]
      ];
    }

    let map, fullBounds;
    const segmentLines = [];
    const pointMarkers = [];
    const timeLabels = [];
    const stormRings = [];
    let forecastCone = null;
    let currentPulse = null;

    const labelItems = [];
    let moveRaf = false;

    function clearLayerArr(arr){
      arr.forEach(x => x.remove());
      arr.length = 0;
    }

    function ensurePanes(){
      if(!map.getPane("conePane")){ map.createPane("conePane"); map.getPane("conePane").style.zIndex = 200; }
      if(!map.getPane("linePane")){ map.createPane("linePane"); map.getPane("linePane").style.zIndex = 350; }
      if(!map.getPane("ringPane")){ map.createPane("ringPane"); map.getPane("ringPane").style.zIndex = 360; }
      if(!map.getPane("markerPane2")){ map.createPane("markerPane2"); map.getPane("markerPane2").style.zIndex = 400; }
      if(!map.getPane("labelLinePane")){ map.createPane("labelLinePane"); map.getPane("labelLinePane").style.zIndex = 445; }
      if(!map.getPane("labelPane")){ map.createPane("labelPane"); map.getPane("labelPane").style.zIndex = 450; }
    }

    function drawForecastCone(){
      const showCone = $("toggleCone")?.checked !== false;

      if(!showCone){
        if(forecastCone){
          forecastCone.remove();
          forecastCone = null;
        }
        return;
      }

      if(forecastCone){
        forecastCone.remove();
        forecastCone = null;
      }

      const poly = buildForecastConePolygonSmooth();
      if(!poly || poly.length < 4) return;

      forecastCone = L.polygon(poly, {
        pane: "conePane",
        stroke: true,
        color: "#60a5fa",
        weight: 1,
        opacity: 0.18,
        fillColor: "#60a5fa",
        fillOpacity: 0.16,
        smoothFactor: 1.2,
        interactive: false
      }).addTo(map);

      try{
        forecastCone.bringToBack();
      }catch(e){}
    }

    function getLineWeight(level){
      if(level === "LOW" || level === "TD") return 2.5;
      if(level === "TS") return 3;
      if(level === "STS") return 3.5;
      if(level === "TY" || level === "STY") return 4;
      return 3;
    }

    function drawSegments(){
      clearLayerArr(segmentLines);
      for(let i=0; i<points.length-1; i++){
        const a = points[i], b = points[i+1];
        const st = getStyle(b.level);
        const isForecastSeg = (a.kind === "fcst" || b.kind === "fcst");
        const seg = L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {
          pane: "linePane",
          weight: getLineWeight(b.level),
          color: st.color,
          dashArray: isForecastSeg ? "6 8" : null,
          opacity: isForecastSeg ? 0.92 : 1
        }).addTo(map);
        segmentLines.push(seg);
      }
      fullBounds = L.latLngBounds(points.map(p => [p.lat,p.lon]));
    }

    function drawPoints(highlightObsIdx){
      clearLayerArr(pointMarkers);
      if(currentPulse) currentPulse.remove();

      points.forEach((p, i) => {
        const st = getStyle(p.level);
        const isHighlight = i === highlightObsIdx;
        const isFcst = p.kind === "fcst";
        const radius = isHighlight ? 8 : (isFcst ? 5.5 : 4.5);

        const marker = L.circleMarker([p.lat, p.lon], {
          pane: "markerPane2",
          radius,
          weight: isHighlight ? 3.5 : 2,
          color: st.color,
          fillColor: "#ffffff",
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(popupHtml(p), { maxWidth: 360 });
        marker.on("click", () => marker.openPopup());
        pointMarkers.push(marker);
      });

      const cur = points[highlightObsIdx];
      const stCur = getStyle(cur.level);
      currentPulse = L.circleMarker([cur.lat, cur.lon], {
        pane: "markerPane2",
        radius: 12,
        weight: 2,
        color: stCur.color,
        fillOpacity: 0,
        interactive: false
      }).addTo(map);
    }

    function drawStormRings(){
      const showRings = $("toggleRings")?.checked !== false;
      if(!showRings){
        clearLayerArr(stormRings);
        return;
      }

      clearLayerArr(stormRings);
      points.forEach((p) => {
        const rKm = p.storm_radius_km;
        if(typeof rKm !== "number" || !isFinite(rKm) || rKm <= 0) return;
        const st = getStyle(p.level);
        const ring = L.circle([p.lat, p.lon], {
          pane: "ringPane",
          radius: kmToMeters(rKm),
          color: st.color,
          weight: 1.5,
          opacity: 0.65,
          fillColor: st.color,
          fillOpacity: 0.06,
          interactive: false
        }).addTo(map);
        stormRings.push(ring);
      });
    }

    function getStormContainerPoint(item){
      const p = points[item.idx];
      return map.latLngToContainerPoint([p.lat, p.lon]);
    }

    function getLabelTopLeftPx(item){
      const stormPt = getStormContainerPoint(item);
      return { x: stormPt.x + item.dx, y: stormPt.y + item.dyTop };
    }

    function getLabelAnchorPx(item){
      const stormPt = getStormContainerPoint(item);
      const topLeft = getLabelTopLeftPx(item);

      const left = topLeft.x;
      const top = topLeft.y;
      const right = left + item.w;
      const bottom = top + item.h;
      const cx = left + item.w / 2;
      const cy = top + item.h / 2;

      const candidates = [
        { x: left,  y: cy },
        { x: right, y: cy },
        { x: cx,    y: top },
        { x: cx,    y: bottom }
      ];

      let best = candidates[0];
      let bestD = Infinity;

      for(const c of candidates){
        const dx = stormPt.x - c.x;
        const dy = stormPt.y - c.y;
        const d = dx*dx + dy*dy;
        if(d < bestD){
          bestD = d;
          best = c;
        }
      }
      return best;
    }

    function updateSingleLabelGeometry(item){
      const topLeft = getLabelTopLeftPx(item);
      const ll = map.containerPointToLatLng(L.point(topLeft.x, topLeft.y));
      item.marker.setLatLng(ll);

      const anchorPx = getLabelAnchorPx(item);
      const anchorLL = map.containerPointToLatLng(L.point(anchorPx.x, anchorPx.y));
      const p = points[item.idx];
      item.line.setLatLngs([[p.lat, p.lon], [anchorLL.lat, anchorLL.lng]]);
    }

    function updateLabelLines(){
      for(const item of labelItems){
        updateSingleLabelGeometry(item);
      }
    }

    function scheduleUpdateLabelLines(){
      if(moveRaf) return;
      moveRaf = true;
      requestAnimationFrame(() => {
        moveRaf = false;
        updateLabelLines();
      });
    }

    function makeLabelHtml(timeText, color, isCurrent=false){
      return `
        <div class="tlabel-wrap">
          <span class="tlabel ${isCurrent ? "current" : ""}" ${isCurrent ? `style="border-color:${color}66;"` : ""}>
            <span class="miniDot" style="background:${color};"></span>
            ${escapeHtml(fmtTime(timeText,"full"))}
          </span>
        </div>
      `;
    }

    function measureLabel(html){
      let measurer = document.getElementById("__label_measurer__");
      if(!measurer){
        measurer = document.createElement("div");
        measurer.id = "__label_measurer__";
        measurer.style.position = "fixed";
        measurer.style.left = "-9999px";
        measurer.style.top = "-9999px";
        measurer.style.visibility = "hidden";
        measurer.style.pointerEvents = "none";
        document.body.appendChild(measurer);
      }
      measurer.innerHTML = html;
      const node = measurer.querySelector(".tlabel");
      if(!node) return { w: 160, h: 32 };
      const r = node.getBoundingClientRect();
      return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
    }

    function enableLabelDrag(item){
      const el = item.marker.getElement();
      if(!el) return;
      const labelEl = el.querySelector(".tlabel");
      if(!labelEl) return;

      let startMouse = null;
      let startOffset = null;
      let dragging = false;

      function onPointerMove(ev){
        if(!dragging) return;
        item.dx = startOffset.x + (ev.clientX - startMouse.x);
        item.dyTop = startOffset.y + (ev.clientY - startMouse.y);
        updateSingleLabelGeometry(item);
      }

      function onPointerUp(){
        if(!dragging) return;
        dragging = false;
        labelEl.classList.remove("dragging");
        window.removeEventListener("pointermove", onPointerMove);
        window.removeEventListener("pointerup", onPointerUp);
      }

      labelEl.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        dragging = true;
        startMouse = { x: ev.clientX, y: ev.clientY };
        startOffset = { x: item.dx, y: item.dyTop };
        labelEl.classList.add("dragging");
        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
      });
    }

    function createLabelItem(idx, isCurrent, dx, dyTop){
      const p = points[idx];
      const st = getStyle(p.level);
      const html = makeLabelHtml(p.time, st.color, isCurrent);
      const size = measureLabel(html);

      const item = {
        idx,
        isCurrent,
        dx,
        dyTop,
        w: size.w,
        h: size.h,
        marker: null,
        line: null
      };

      const topLeft = getLabelTopLeftPx(item);

      const marker = L.marker(
        map.containerPointToLatLng(L.point(topLeft.x, topLeft.y)),
        {
          pane: "labelPane",
          icon: L.divIcon({
            className: "ty-label-icon",
            html,
            iconSize: [size.w, size.h],
            iconAnchor: [0, 0]
          }),
          interactive: true,
          keyboard: false
        }
      ).addTo(map);

      const anchorPx = getLabelAnchorPx(item);
      const anchorLL = map.containerPointToLatLng(L.point(anchorPx.x, anchorPx.y));

      const line = L.polyline([[p.lat, p.lon], [anchorLL.lat, anchorLL.lng]], {
        pane: "labelLinePane",
        color: isCurrent ? "rgba(17,24,39,.55)" : "rgba(17,24,39,.38)",
        weight: isCurrent ? 2 : 1.5,
        interactive: false
      }).addTo(map);

      item.marker = marker;
      item.line = line;

      timeLabels.push(marker, line);
      labelItems.push(item);

      setTimeout(() => enableLabelDrag(item), 0);
    }

    function drawTimeLabels(latestObsIdx){
      clearLayerArr(timeLabels);
      labelItems.length = 0;

      const show = $("toggleLabels")?.checked !== false;
      if(!show) return;

      const preferredOffsets = [
        { dx: 115, dy: -18 },
        { dx: 115, dy: 28 },
        { dx: 145, dy: -52 },
        { dx: 145, dy: 58 },
        { dx: -150, dy: -28 },
        { dx: -150, dy: 38 },
        { dx: 85, dy: -68 },
        { dx: 85, dy: 72 },
        { dx: 180, dy: -8 },
        { dx: -185, dy: 0 },
        { dx: 210, dy: 36 },
        { dx: -210, dy: 52 }
      ];

      function rectOverlap(a, b, pad = 10){
        return !(
          a.x + a.w + pad < b.x ||
          b.x + b.w + pad < a.x ||
          a.y + a.h + pad < b.y ||
          b.y + b.h + pad < a.y
        );
      }

      function getRectForOffset(idx, dx, dyTop, w, h){
        const stormPt = map.latLngToContainerPoint([points[idx].lat, points[idx].lon]);
        return {
          x: stormPt.x + dx,
          y: stormPt.y + dyTop,
          w,
          h
        };
      }

      function pickNonOverlapOffset(idx, w, h, usedRects, baseOffsets){
        for(const raw of baseOffsets){
          const dx = raw.dx;
          const dyTop = raw.dy - h;
          const rect = getRectForOffset(idx, dx, dyTop, w, h);

          let bad = false;
          for(const r of usedRects){
            if(rectOverlap(rect, r, 12)){
              bad = true;
              break;
            }
          }

          if(!bad){
            usedRects.push(rect);
            return { dx, dyTop };
          }
        }

        const expandSteps = [40, 80, 120, 160];
        for(const step of expandSteps){
          for(const raw of baseOffsets){
            const variants = [
              { dx: raw.dx + step, dy: raw.dy },
              { dx: raw.dx - step, dy: raw.dy },
              { dx: raw.dx, dy: raw.dy + step },
              { dx: raw.dx, dy: raw.dy - step }
            ];

            for(const v of variants){
              const dx = v.dx;
              const dyTop = v.dy - h;
              const rect = getRectForOffset(idx, dx, dyTop, w, h);

              let bad = false;
              for(const r of usedRects){
                if(rectOverlap(rect, r, 12)){
                  bad = true;
                  break;
                }
              }

              if(!bad){
                usedRects.push(rect);
                return { dx, dyTop };
              }
            }
          }
        }

        const fallback = baseOffsets[0];
        const fallbackRect = getRectForOffset(idx, fallback.dx, fallback.dy - h, w, h);
        usedRects.push(fallbackRect);
        return { dx: fallback.dx, dyTop: fallback.dy - h };
      }

      function addAutoLabel(idx, isCurrent, usedRects, preferSet){
        const p = points[idx];
        const st = getStyle(p.level);
        const html = makeLabelHtml(p.time, st.color, isCurrent);
        const size = measureLabel(html);

        const picked = pickNonOverlapOffset(idx, size.w, size.h, usedRects, preferSet);
        createLabelItem(idx, isCurrent, picked.dx, picked.dyTop);
      }

      const usedRects = [];

      addAutoLabel(
        latestObsIdx,
        true,
        usedRects,
        [
          { dx: 95, dy: 10 },
          { dx: 120, dy: -22 },
          { dx: -165, dy: 16 },
          { dx: 145, dy: 46 }
        ]
      );

      let fcstCount = 1;
      const STEP = 2;

      points.forEach((p, idx) => {
        if(p.kind !== "fcst") return;

        const shouldShow = (fcstCount % STEP === 0);
        fcstCount += 1;
        if(!shouldShow) return;

        addAutoLabel(idx, false, usedRects, preferredOffsets);
      });

      updateLabelLines();
    }

    function fitAll(){
      if(fullBounds && fullBounds.isValid()){
        map.fitBounds(fullBounds, {
          paddingTopLeft: [30, 30],
          paddingBottomRight: [220, 40]
        });
      }
    }

    function renderForecastList(){
      const list = $("fcstList");
      list.innerHTML = "";
      const fcst = points.map((p, idx) => ({...p, _idx: idx})).filter(p => p.kind === "fcst");
      $("fcstCount").textContent = `${fcst.length} 筆`;

      if(fcst.length === 0){
        const empty = document.createElement("div");
        empty.className = "fcstCard";
        empty.style.width = "100%";
        empty.style.cursor = "default";
        empty.innerHTML = `<div style="font-weight:900;color:#111;">沒有預報資料</div>`;
        list.appendChild(empty);
        return;
      }

      fcst.forEach(p => {
        const st = getStyle(p.level);
        const card = document.createElement("div");
        card.className = "fcstCard";
        card.innerHTML = `
          <div class="fcstRow1">
            <div class="fcstTime">${escapeHtml(fmtTime(p.time,"short"))}</div>
            <span class="fcstBadge" style="border-color:${st.color}33;">
              <span style="width:8px;height:8px;border-radius:999px;background:${st.color};display:inline-block;"></span>
              ${escapeHtml(p.level || "-")}
            </span>
          </div>
          <div class="fcstKv">
            <div class="k">風速</div><div class="v">${escapeHtml(fmtWindMs(p.wind))}</div>
            <div class="k">氣壓</div><div class="v">${p.pressure ? escapeHtml(p.pressure + " hPa") : "—"}</div>
            <div class="k">座標</div><div class="v">${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}</div>
            <div class="k">誤差</div><div class="v">${(typeof p.fcst_radius_km === "number") ? escapeHtml(p.fcst_radius_km + " km") : "—"}</div>
          </div>
        `;
        card.addEventListener("click", () => {
          const idx = p._idx;
          if(pointMarkers[idx]){
            map.setView([p.lat, p.lon], Math.max(map.getZoom(), 6), { animate: true });
            pointMarkers[idx].openPopup();
          }
        });
        list.appendChild(card);
      });
    }

    function enableHorizontalWheelScroll(){
      const el = $("fcstList");
      if(!el) return;
      el.addEventListener("wheel", (e) => {
        if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
          el.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    }
    function checkCountryAlerts(points, map) {
    // 1. 篩選出只有預測性質的點位 (fcst)
    const forecastPoints = points.filter(p => p.kind === "fcst");

    monitorAreas.forEach(area => {
        let isUnderThreat = false;
        let threatLevel = ""; // 可擴充：用來記錄預計到達時間

        forecastPoints.forEach(p => {
            // 計算颱風中心點與國家座標的距離 (1度約等於111公里)
            const dist = Math.sqrt(Math.pow(p.lat - area.lat, 2) + Math.pow(p.lon - area.lon, 2)) * 111;
            
            // 判定門檻：優先使用該點的暴風半徑 (storm_radius_km)，若無則使用國家的預設門檻 (range * 111)
            const alertThreshold = p.storm_radius_km || (area.range * 111) || 300;

            if (dist < alertThreshold) {
                isUnderThreat = true;
            }
        });

        if (isUnderThreat) {
            // 在地圖上繪製警告標籤
            const alertIcon = L.divIcon({
                className: 'alert-icon', // 建議統一使用你在 CSS 定義的 class
                html: `<div class="country-alert">⚠ 預警：${area.name}</div>`,
                iconAnchor: [0, 0]
            });

            L.marker([area.lat, area.lon], { 
                icon: alertIcon,
                pane: 'labelPane', // 確保標籤在最上層，不會被陰影帶遮住
                interactive: false 
            }).addTo(map);
            
            // 可選：在控制台記錄偵測結果，方便除錯
            console.log(`[Alert] ${area.name} 受到預測路徑威脅`);
        }
    });
}

      ensurePanes();
const MAPBOX_TOKEN = "pk.eyJ1IjoiaXR6c2VpciIsImEiOiJja240bTE0ZXYxc2xqMm5tbng1ZDd0a3Y1In0.8z3D3HF0GTrWJXZ9YtVT8Q";
const MAPBOX_STYLE = "itzseir/cmihg7ep200rk01qq5ypv03c3";

      drawForecastCone();
     drawForecastCone();
      drawSegments();

      const latestObsIdx = getLatestObsIndex();
      setObsTopInfo(points[latestObsIdx]);

      // --- 新增：執行國家預警判定 (僅限預測點) ---
      if (typeof checkCountryAlerts === "function") {
        checkCountryAlerts(points, map);

      // --- 介面功能 ---
      renderLegend();

      // 事件監聽
      $("toggleLabels").addEventListener("change", () => drawTimeLabels(latestObsIdx));

      window.addEventListener("beforeprint", () => map.invalidateSize(true));

        map.invalidateSize(true);
        setTimeout(() => window.print(), 30);
      });

      setTimeout(() => map.invalidateSize(), 250);
    }
    window.addEventListener("load", init);
