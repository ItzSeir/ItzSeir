<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Typhoon Track – Optimized</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --shadow: 0 2px 4px 5px rgba(77, 89, 95, 0.19);
      --card-bg: rgba(255,255,255,0.92);
      --blur: blur(6px);
      --muted: #6b7280;
      --ink: #111;
    }
    *{ box-sizing: border-box; }

    html, body{ height: 100%; overflow: visible; }
    body{
      margin:0;
      font-family:"Noto Sans TC","Segoe UI",Arial,sans-serif;
      background: transparent;
      color: var(--ink);
      padding: 18px 0;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 14px;
      overflow-x: hidden;
    }

    .panel{
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow), 0 0 0 1px rgba(0,0,0,.06) inset;
      overflow: hidden;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content: space-between; }
    .titleRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex: 1 1 auto; min-width: 240px; }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-weight:900; font-size:12px;
      width: fit-content; white-space:nowrap;
    }

    .title{ font-weight: 900; font-size: 18px; color: var(--ink); }
    .dot{ width:10px;height:10px;border-radius:999px; display:inline-block; background:#ef4444; }

    .btn{
      height: 42px; padding: 0 14px; border-radius: 14px;
      border: 1px solid rgba(0,0,0,.10); background:#fff;
      font-weight: 900; cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 18px rgba(77,89,95,.14); }

    .sub{ margin-top: 6px; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.6; }

    .infoBar{ margin-top: 12px; display:grid; grid-template-columns: 1fr; gap: 10px; }
    .infoHead{ display:flex; align-items:center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .infoLeft{ display:flex; align-items:center; gap: 10px; flex-wrap: wrap; }

    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-weight: 900; font-size: 12px;
      white-space: nowrap;
    }

    .miniMeta{ font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }

    .toggle{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:#fff; font-size:12px; font-weight:900;
      color:#111; user-select:none; cursor:pointer;
    }
    .toggle input{ accent-color: #111; }

    .infoGrid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ibox{
      background:#fff; border-radius: 14px;
      border: 1px solid rgba(0,0,0,.06); padding: 12px 12px;
      min-height: 64px; display:flex; flex-direction: column; justify-content: center;
    }
    .ival{ font-size: 20px; font-weight: 900; color:#111; line-height: 1.1; letter-spacing: .2px; }
    .ilabel{ margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
    @media (max-width: 900px){ .infoGrid{ grid-template-columns: repeat(2, 1fr); } }

    .fcstWrap{
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,.06); border-radius: 14px;
      padding: 10px; overflow: hidden;
    }
    .fcstTop{ display:flex; align-items:center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .fcstTitle{ display:flex; align-items:center; gap: 10px; font-weight: 900; font-size: 12px; color:#374151; }
    .chip{
      display:inline-flex; align-items:center; gap:8px; padding:6px 10px;
      border-radius:999px; border:1px solid rgba(0,0,0,.08);
      background:#fff; font-size:12px; font-weight:900; color:#111; white-space:nowrap;
    }
    .fcstList{
      display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding-bottom: 6px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
    }
    .fcstList::-webkit-scrollbar{ height: 10px; }
    .fcstList::-webkit-scrollbar-thumb{ background: rgba(0,0,0,.12); border-radius: 999px; }

    .fcstCard{
      flex: 0 0 auto; width: 220px; background:#fff;
      border: 1px solid rgba(0,0,0,.06); border-radius: 14px;
      padding: 10px 10px; scroll-snap-align: start; cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .fcstCard:hover{ transform: translateY(-1px); box-shadow: 0 10px 24px rgba(77,89,95,.12); }

    .fcstRow1{ display:flex; justify-content: space-between; align-items:center; gap: 10px; margin-bottom: 6px; }
    .fcstTime{ font-weight: 900; font-size: 12px; color:#111; white-space: nowrap; }
    .fcstBadge{
      display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
      border-radius:999px; border:1px solid rgba(0,0,0,.08); background:#fff;
      font-size:12px; font-weight:900; white-space: nowrap;
    }
    .fcstKv{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; font-size: 12px; font-weight: 800; color:#374151; }
    .fcstKv .k{ color: var(--muted); font-weight: 900; }
    .fcstKv .v{ color:#111; font-weight: 900; }

    .tableWrap{
      margin-top: 12px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 14px;
      padding: 10px;
      overflow: hidden;
    }
    .tableOuter{
      overflow-x:auto;
      border-radius: 12px;
      background:#fff;
      border: 1px solid rgba(0,0,0,.06);
    }
    table{
      width:100%;
      border-collapse: collapse;
      min-width: 920px;
    }
    th, td{
      padding: 10px 12px;
      text-align:left;
      border-bottom: 1px solid rgba(0,0,0,.06);
      font-size: 12px;
    }
    th{
      background:#f8fafc;
      font-weight: 900;
      color:#111;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    td{
      color:#374151;
      font-weight: 700;
    }

    #map{
      margin-top: 12px;
      height: 550px;
      min-height: 420px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.06);
      background: #fff;
    }

    .popup-card{ min-width: 240px; }
    .popup-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 8px; }
    .popup-title{ font-weight: 900; color:#111; }
    .popup-badge{
      display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
      border-radius:999px; font-size:12px; font-weight:900;
      border:1px solid rgba(0,0,0,.08); background:#fff; white-space:nowrap;
    }
    .popup-kv{ display:grid; grid-template-columns: 70px 1fr; gap:6px 10px; font-size:12px; color:#374151; font-weight:700; }
    .popup-kv div:nth-child(odd){ color:#6b7280; font-weight:900; }

    .tlabel{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,.08);
      font-size: 12px;
      font-weight: 900;
      color:#111;
      box-shadow: 0 8px 20px rgba(77,89,95,.10);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .tlabel .miniDot{
      width:9px;
      height:9px;
      border-radius:999px;
      display:inline-block;
      background:#111;
      flex: 0 0 auto;
    }

    .tlabel-wrap{ transform: translateY(-4px); }

    .tlabel.current{
      border: 2px solid rgba(83,106,184,.35);
      box-shadow: 0 10px 28px rgba(77,89,95,.16);
    }

    @media print{
      body{ padding: 0; }
      .btn, .toggle{ display:none !important; }
      .panel{ box-shadow:none !important; }
      #map{ height: 520px; }

      .fcstWrap{ break-inside: avoid; page-break-inside: avoid; }
      .fcstTop{ break-inside: avoid; page-break-inside: avoid; }
      .fcstList{
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        overflow: visible !important;
        padding-bottom: 0 !important;
        scroll-snap-type: none !important;
      }
      .fcstCard{
        width: auto !important;
        cursor: default !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .tableWrap{ break-inside: avoid; page-break-inside: avoid; }
      .tableOuter{ overflow: visible !important; }
      table{ min-width: auto !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <div class="titleRow">
          <span class="pill"><span class="dot"></span> 颱風情報</span>
          <div class="title" id="pageTitle">載入中...</div>
        </div>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label class="toggle" title="顯示/隱藏地圖時間標籤">
            <input type="checkbox" id="toggleLabels" checked>
            顯示時間
          </label>
          <label class="toggle" title="顯示/隱藏預報不確定性陰影帶（cone）">
            <input type="checkbox" id="toggleCone" checked>
            陰影帶
          </label>
          <label class="toggle" title="顯示/隱藏暴風圈（storm radius）">
            <input type="checkbox" id="toggleRings" checked>
            暴風圈
          </label>
          <button class="btn" id="fitAllBtn">顯示完整路徑</button>
          <button class="btn" id="printBtn">列印 / 匯出 PDF</button>
        </div>
      </div>

      <div class="sub" id="sourceText">
        <b>來源：載入中...</b><br>
      </div>

      <div class="infoBar">
        <div class="infoHead">
          <div class="infoLeft">
            <div class="badge">
              <span class="dot" id="levelDotObs"></span>
              <span id="levelTextObs">—</span>
            </div>
            <div class="miniMeta" id="infoTimeObs">時間：—</div>
          </div>
          <div class="miniMeta" id="infoNoteObs">—</div>
        </div>

        <div class="infoGrid" aria-label="obs-info-grid">
          <div class="ibox"><div class="ival" id="obsCoord">—</div><div class="ilabel">座標</div></div>
          <div class="ibox"><div class="ival" id="obsWind">—</div><div class="ilabel">風速</div></div>
          <div class="ibox"><div class="ival" id="obsPres">—</div><div class="ilabel">氣壓</div></div>
        </div>

        <div class="fcstWrap">
          <div class="fcstTop">
            <div class="fcstTitle">
              <span class="dot" style="background:#60a5fa;"></span>
              <span>預報（全部）</span>
            </div>
            <span class="chip" id="fcstCount">0 筆</span>
          </div>
          <div class="fcstList" id="fcstList" aria-label="forecast-list"></div>
        </div>

        <div class="tableWrap">
          <div class="fcstTop" style="margin-bottom:10px;">
            <div class="fcstTitle">
              <span class="dot" style="background:#22c55e;"></span>
              <span>資料表</span>
            </div>
            <span class="chip" id="tableCount">0 筆</span>
          </div>
          <div class="tableOuter">
            <table id="weatherTable">
              <thead>
                <tr>
                  <th>時間</th>
                  <th>類型</th>
                  <th>強度</th>
                  <th>緯度</th>
                  <th>經度</th>
                  <th>風速</th>
                  <th>氣壓</th>
                  <th>備註</th>
                  <th>預報半徑</th>
                  <th>暴風圈</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const MAPBOX_TOKEN = "YOUR_MAPBOX_TOKEN";
    const MAPBOX_STYLE = "YOUR_USERNAME/YOUR_STYLE_ID";

    let weatherMeta = {
      title: "颱風情報",
      source: "—"
    };

    let points = [];

    const levelStyle = {
      LOW: { color: "#6b7280", label: "低壓/殘餘 LOW" },
      TD:  { color: "#536ab8", label: "熱帶低壓 TD" },
      TS:  { color: "#22c55e", label: "輕度颱風 TS" },
      STS: { color: "#f59e0b", label: "中度颱風 STS" },
      TY:  { color: "#ef4444", label: "強烈颱風 TY" },
      STY: { color: "#7c3aed", label: "超強颱風 STY" }
    };

    function $(id){ return document.getElementById(id); }

    function getStyle(level){
      return levelStyle[level] || { color:"#111827", label: level || "Unknown" };
    }

    function escapeHtml(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m]));
    }

    function kindLabel(kind){
      return kind === "fcst" ? "預報" : "歷史";
    }

    function parseLocalDateTime(s){
      const m = String(s ?? "").trim().match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\s+(\d{1,2}):(\d{2})$/);
      if(!m) return null;
      const y = Number(m[1]);
      const mo = Number(m[2]);
      const d = Number(m[3]);
      const hh = Number(m[4]);
      const mm = Number(m[5]);
      if(!isFinite(y+mo+d+hh+mm)) return null;
      return new Date(y, mo - 1, d, hh, mm, 0, 0);
    }

    function pad2(n){ return String(n).padStart(2, "0"); }

    function fmtTime(s, mode="full"){
      const dt = parseLocalDateTime(s);
      if(!dt) return String(s ?? "—");
      const Y = dt.getFullYear();
      const M = dt.getMonth() + 1;
      const D = dt.getDate();
      const hh = pad2(dt.getHours());
      const mm = pad2(dt.getMinutes());
      if(mode === "short") return `${M}/${D} ${hh}:${mm}`;
      return `${Y}-${pad2(M)}-${pad2(D)} ${hh}:${mm}`;
    }

    function fmtWindMs(ms){
      if(ms == null || !isFinite(ms)) return "—";
      return `${ms} m/s`;
    }

    function fmtKm(v){
      if(v == null || !isFinite(v)) return "—";
      return `${v} km`;
    }

    async function loadWeatherData(){
      try{
        const res = await fetch("./weather.json");
        if(!res.ok){
          throw new Error(`Failed to load weather.json: ${res.status}`);
        }

        const data = await res.json();

        weatherMeta.title = data.title || "颱風情報";
        weatherMeta.source = data.source || "—";

        points = (Array.isArray(data.points) ? data.points : []).map(p => ({
          lat: Number(p.lat),
          lon: Number(p.lon),
          time: String(p.time ?? ""),
          kind: String(p.kind ?? ""),
          level: String(p.level ?? ""),
          wind: p.wind === null || p.wind === undefined || p.wind === "" ? null : Number(p.wind),
          pressure: p.pressure === null || p.pressure === undefined || p.pressure === "" ? null : Number(p.pressure),
          note: String(p.note ?? ""),
          fcst_radius_km: p.fcst_radius_km === null || p.fcst_radius_km === undefined || p.fcst_radius_km === "" ? 0 : Number(p.fcst_radius_km),
          storm_radius_km: p.storm_radius_km === null || p.storm_radius_km === undefined || p.storm_radius_km === "" ? 0 : Number(p.storm_radius_km)
        })).filter(p => isFinite(p.lat) && isFinite(p.lon));

        $("pageTitle").textContent = weatherMeta.title;
        $("sourceText").innerHTML = `<b>來源：${escapeHtml(weatherMeta.source)}</b><br>`;
      }catch(err){
        console.error(err);
        alert("weather.json 載入失敗，請確認路徑是否正確。");
      }
    }

    function popupHtml(p){
      const st = getStyle(p.level);
      const r = (p.kind === "fcst" && typeof p.fcst_radius_km === "number") ? `（誤差：約 ${p.fcst_radius_km} km）` : "";
      const sr = (typeof p.storm_radius_km === "number") ? `${p.storm_radius_km} km` : "—";
      return `
        <div class="popup-card">
          <div class="popup-head">
            <div class="popup-title">${escapeHtml(kindLabel(p.kind))}</div>
            <span class="popup-badge" style="border-color:${st.color}33;">
              <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:${st.color};"></span>
              ${escapeHtml(st.label)}
            </span>
          </div>
          <div class="popup-kv">
            <div>時間</div><div>${escapeHtml(fmtTime(p.time,"full"))}</div>
            <div>座標</div><div>${p.lat.toFixed(2)}, ${p.lon.toFixed(2)} ${r}</div>
            <div>風速</div><div>${escapeHtml(fmtWindMs(p.wind))}</div>
            <div>氣壓</div><div>${p.pressure ? escapeHtml(p.pressure + " hPa") : "-"}</div>
            <div>暴風圈</div><div>${escapeHtml(sr)}</div>
            <div>備註</div><div>${escapeHtml(p.note || "-")}</div>
          </div>
        </div>
      `;
    }

    function getLatestObsIndex(){
      for(let i = points.length - 1; i >= 0; i--){
        if(points[i].kind === "obs") return i;
      }
      return 0;
    }

    function setObsTopInfo(p){
      const st = getStyle(p.level);
      $("levelDotObs").style.background = st.color;
      $("levelTextObs").textContent = st.label;
      $("infoTimeObs").textContent = `時間：${fmtTime(p.time,"full")}`;
      $("infoNoteObs").textContent = (p.note && p.note.trim()) ? `備註：${p.note}` : "—";
      $("obsCoord").textContent = `${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}`;
      $("obsWind").textContent = fmtWindMs(p.wind);
      $("obsPres").textContent = p.pressure ? `${p.pressure} hPa` : "—";
    }

    function renderWeatherTable(){
      const tbody = document.querySelector("#weatherTable tbody");
      tbody.innerHTML = "";

      points.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(fmtTime(p.time,"full"))}</td>
          <td>${escapeHtml(kindLabel(p.kind))}</td>
          <td>${escapeHtml(p.level || "—")}</td>
          <td>${isFinite(p.lat) ? p.lat.toFixed(2) : "—"}</td>
          <td>${isFinite(p.lon) ? p.lon.toFixed(2) : "—"}</td>
          <td>${escapeHtml(fmtWindMs(p.wind))}</td>
          <td>${p.pressure ? escapeHtml(p.pressure + " hPa") : "—"}</td>
          <td>${escapeHtml(p.note || "—")}</td>
          <td>${escapeHtml(fmtKm(p.fcst_radius_km))}</td>
          <td>${escapeHtml(fmtKm(p.storm_radius_km))}</td>
        `;
        tbody.appendChild(tr);
      });

      $("tableCount").textContent = `${points.length} 筆`;
    }

    function toRad(d){ return d * Math.PI / 180; }
    function toDeg(r){ return r * 180 / Math.PI; }
    function kmToMeters(km){ return km * 1000; }

    function bearingDegrees(lat1, lon1, lat2, lon2){
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δλ = toRad(lon2 - lon1);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function destinationPoint(lat, lon, bearingDeg, distanceMeters){
      const R = 6371e3;
      const δ = distanceMeters / R;
      const θ = toRad(bearingDeg);
      const φ1 = toRad(lat);
      const λ1 = toRad(lon);
      const φ2 = Math.asin(Math.sin(φ1)*Math.cos(δ) + Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1), Math.cos(δ) - Math.sin(φ1)*Math.sin(φ2));
      return { lat: toDeg(φ2), lon: ((toDeg(λ2) + 540) % 360) - 180 };
    }

    function avgAngleDeg(a, b){
      const ax = Math.cos(toRad(a)), ay = Math.sin(toRad(a));
      const bx = Math.cos(toRad(b)), by = Math.sin(toRad(b));
      const x = ax + bx, y = ay + by;
      if(Math.abs(x) < 1e-9 && Math.abs(y) < 1e-9) return a;
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function buildForecastConePolygonSmooth({ stepKm = 25, arcStep = 6 } = {}){
      const apex = points[getLatestObsIndex()];
      const firstFcstIdx = points.findIndex(p => p.kind === "fcst");
      if(firstFcstIdx === -1) return null;

      const fcst = points.slice(firstFcstIdx).filter(p => p.kind === "fcst");
      if(fcst.length < 2) return null;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function distKm(a, b){
        const R = 6371;
        const dLat = toRad(b.lat - a.lat);
        const dLon = toRad(b.lon - a.lon);
        const s =
          Math.sin(dLat/2)**2 +
          Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
        return 2 * R * Math.asin(Math.sqrt(s));
      }

      function catmullRom(p0, p1, p2, p3, t){
        const t2 = t*t, t3 = t2*t;
        const lat =
          0.5 * ((2*p1.lat) + (-p0.lat + p2.lat)*t + (2*p0.lat - 5*p1.lat + 4*p2.lat - p3.lat)*t2 + (-p0.lat + 3*p1.lat - 3*p2.lat + p3.lat)*t3);
        const lon =
          0.5 * ((2*p1.lon) + (-p0.lon + p2.lon)*t + (2*p0.lon - 5*p1.lon + 4*p2.lon - p3.lon)*t2 + (-p0.lon + 3*p1.lon - 3*p2.lon + p3.lon)*t3);
        return { lat, lon };
      }

      function smoothstep(t){ return t*t*(3 - 2*t); }

      const ctrl = [
        { lat: apex.lat, lon: apex.lon, rKm: 0 },
        ...fcst.map((p, i) => ({
          lat: p.lat, lon: p.lon,
          rKm: clamp((typeof p.fcst_radius_km === "number") ? p.fcst_radius_km : (80 + i*40), 0, 900)
        }))
      ];

      const dense = [];
      for(let i=0; i<ctrl.length-1; i++){
        const A = ctrl[i];
        const B = ctrl[i+1];
        const d = distKm(A, B);
        const n = Math.max(1, Math.ceil(d / stepKm));

        for(let k=0; k<n; k++){
          const t = k / n;
          const p0 = ctrl[Math.max(0, i-1)];
          const p1 = ctrl[i];
          const p2 = ctrl[i+1];
          const p3 = ctrl[Math.min(ctrl.length-1, i+2)];
          const s = catmullRom(p0, p1, p2, p3, t);

          const rt = smoothstep(t);
          const r = A.rKm + (B.rKm - A.rKm) * rt;

          dense.push({ lat: s.lat, lon: s.lon, rKm: clamp(r, 0, 900) });
        }
      }
      dense.push({ lat: ctrl[ctrl.length-1].lat, lon: ctrl[ctrl.length-1].lon, rKm: ctrl[ctrl.length-1].rKm });

      function denseHeading(i){
        if(i <= 0){
          const a = dense[0], b = dense[1] || dense[0];
          return bearingDegrees(a.lat, a.lon, b.lat, b.lon);
        }
        if(i >= dense.length - 1){
          const p = dense[i-1], c = dense[i];
          return bearingDegrees(p.lat, p.lon, c.lat, c.lon);
        }
        const p = dense[i-1], c = dense[i], n = dense[i+1];
        const inB = bearingDegrees(p.lat, p.lon, c.lat, c.lon);
        const outB = bearingDegrees(c.lat, c.lon, n.lat, n.lon);
        return avgAngleDeg(inB, outB);
      }

      const left = [];
      const right = [];

      for(let i=0; i<dense.length; i++){
        const cur = dense[i];
        const heading = denseHeading(i);
        const rMeters = kmToMeters(cur.rKm);

        const leftPt  = destinationPoint(cur.lat, cur.lon, (heading - 90 + 360) % 360, rMeters);
        const rightPt = destinationPoint(cur.lat, cur.lon, (heading + 90) % 360, rMeters);

        left.push([leftPt.lat, leftPt.lon]);
        right.push([rightPt.lat, rightPt.lon]);
      }

      const end = dense[dense.length - 1];
      const endHeading = denseHeading(dense.length - 1);
      const endRMeters = kmToMeters(end.rKm);
      const endArc = [];
      for(let a=-90; a<=90; a+=arcStep){
        const bearing = (endHeading + a + 360) % 360;
        const pt = destinationPoint(end.lat, end.lon, bearing, endRMeters);
        endArc.push([pt.lat, pt.lon]);
      }

      const start = dense[0];
      const startHeading = denseHeading(0);
      const startRMeters = kmToMeters(Math.max(8, start.rKm * 0.25));
      const startArc = [];
      for(let a=90; a<=270; a+=arcStep){
        const bearing = (startHeading + a + 360) % 360;
        const pt = destinationPoint(start.lat, start.lon, bearing, startRMeters);
        startArc.push([pt.lat, pt.lon]);
      }

      return [...startArc, ...left, ...endArc, ...right.reverse(), startArc[0]];
    }

    function rectsOverlap(a, b){
      return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
    }

    function expandRect(r, pad){
      return { x:r.x - pad, y:r.y - pad, w:r.w + pad*2, h:r.h + pad*2 };
    }

    function distPointToSeg(px, py, ax, ay, bx, by){
      const vx = bx - ax, vy = by - ay;
      const wx = px - ax, wy = py - ay;
      const c1 = vx*wx + vy*wy;
      if (c1 <= 0) return Math.hypot(px-ax, py-ay);
      const c2 = vx*vx + vy*vy;
      if (c2 <= c1) return Math.hypot(px-bx, py-by);
      const t = c1 / c2;
      const projx = ax + t*vx, projy = ay + t*vy;
      return Math.hypot(px-projx, py-projy);
    }

    function rectHitsPolyline(rect, segmentsPx, safeDistPx = 10){
      const samples = [
        [rect.x + rect.w/2, rect.y + rect.h/2],
        [rect.x, rect.y],
        [rect.x + rect.w, rect.y],
        [rect.x, rect.y + rect.h],
        [rect.x + rect.w, rect.y + rect.h],
      ];
      for(const [sx, sy] of samples){
        for(const [a, b] of segmentsPx){
          const d = distPointToSeg(sx, sy, a.x, a.y, b.x, b.y);
          if(d < safeDistPx) return true;
        }
      }
      return false;
    }

    let map, fullBounds;
    const segmentLines = [];
    const pointMarkers = [];
    const timeLabels = [];
    const stormRings = [];
    let forecastCone = null;
    let currentPulse = null;
    let currentTimeLabel = null;
    let cachedConePoly = null;

    const labelItems = [];
    let moveRaf = false;

    function scheduleUpdateLabelLines(){
      if(moveRaf) return;
      moveRaf = true;
      requestAnimationFrame(() => {
        moveRaf = false;
        updateLabelLines();
      });
    }

    function updateLabelLines(){
      for(const it of labelItems){
        const p = points[it.idx];
        if(!p) continue;
        const anchor = map.latLngToContainerPoint([p.lat, p.lon]);
        const attachPx = L.point(anchor.x + it.dx, anchor.y + it.dyTop + it.h/2);
        const attachLL = map.containerPointToLatLng(attachPx);
        if(it.line){
          it.line.setLatLngs([[p.lat, p.lon], [attachLL.lat, attachLL.lng]]);
        }
      }
    }

    function clearLayerArr(arr){
      arr.forEach(x => x.remove());
      arr.length = 0;
    }

    function ensurePanes(){
      if(!map.getPane("conePane")){ map.createPane("conePane"); map.getPane("conePane").style.zIndex = 200; }
      if(!map.getPane("linePane")){ map.createPane("linePane"); map.getPane("linePane").style.zIndex = 350; }
      if(!map.getPane("ringPane")){ map.createPane("ringPane"); map.getPane("ringPane").style.zIndex = 360; }
      if(!map.getPane("markerPane2")){ map.createPane("markerPane2"); map.getPane("markerPane2").style.zIndex = 400; }
      if(!map.getPane("labelPane")){ map.createPane("labelPane"); map.getPane("labelPane").style.zIndex = 450; }
    }

    function drawForecastCone(){
      const showCone = $("toggleCone")?.checked !== false;
      if(!showCone){
        if(forecastCone){ forecastCone.remove(); forecastCone = null; }
        return;
      }
      if(forecastCone) forecastCone.remove();

      if(!cachedConePoly){
        cachedConePoly = buildForecastConePolygonSmooth({ stepKm: 25, arcStep: 6 });
      }
      const poly = cachedConePoly;

      if(poly && poly.length >= 10){
        forecastCone = L.polygon(poly, {
          pane: "conePane",
          stroke: false,
          fillColor: "#60a5fa",
          fillOpacity: 0.12,
          smoothFactor: 1.0
        }).addTo(map);
        try { forecastCone.bringToBack(); } catch(e){}
      }
    }

    function getLineWeight(level){
      if(level === "LOW" || level === "TD") return 2.5;
      if(level === "TS") return 3;
      if(level === "STS") return 3.5;
      if(level === "TY" || level === "STY") return 4;
      return 3;
    }

    function drawSegments(){
      clearLayerArr(segmentLines);

      for(let i=0; i<points.length-1; i++){
        const a = points[i], b = points[i+1];
        const st = getStyle(b.level);
        const isForecastSeg = (a.kind === "fcst" || b.kind === "fcst");

        const seg = L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {
          pane: "linePane",
          weight: getLineWeight(b.level),
          color: st.color,
          dashArray: isForecastSeg ? "6 8" : null,
          opacity: isForecastSeg ? 0.92 : 1
        }).addTo(map);

        segmentLines.push(seg);
      }

      fullBounds = L.latLngBounds(points.map(p => [p.lat,p.lon]));
    }

    function drawPoints(highlightObsIdx){
      clearLayerArr(pointMarkers);
      if(currentPulse) currentPulse.remove();

      points.forEach((p, i) => {
        const st = getStyle(p.level);
        const isHighlight = i === highlightObsIdx;
        const isFcst = p.kind === "fcst";

        const radius =
          isHighlight ? 8 :
          isFcst ? 5.5 : 4.5;

        const marker = L.circleMarker([p.lat, p.lon], {
          pane: "markerPane2",
          radius,
          weight: isHighlight ? 3.5 : 2,
          color: st.color,
          fillColor: "#ffffff",
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(popupHtml(p), { maxWidth: 360 });
        marker.on("click", () => marker.openPopup());
        pointMarkers.push(marker);
      });

      const cur = points[highlightObsIdx];
      const stCur = getStyle(cur.level);

      currentPulse = L.circleMarker([cur.lat, cur.lon], {
        pane: "markerPane2",
        radius: 12,
        weight: 2,
        color: stCur.color,
        fillOpacity: 0,
        interactive: false
      }).addTo(map);
    }

    function drawStormRings(){
      const showRings = $("toggleRings")?.checked !== false;
      if(!showRings){
        clearLayerArr(stormRings);
        return;
      }

      clearLayerArr(stormRings);
      points.forEach((p) => {
        const rKm = p.storm_radius_km;
        if(typeof rKm !== "number" || !isFinite(rKm) || rKm <= 0) return;
        const st = getStyle(p.level);
        const ring = L.circle([p.lat, p.lon], {
          pane: "ringPane",
          radius: kmToMeters(rKm),
          color: st.color,
          weight: 1.5,
          opacity: 0.65,
          fillColor: st.color,
          fillOpacity: 0.06,
          interactive: false
        }).addTo(map);
        stormRings.push(ring);
      });
    }

    function drawTimeLabels(latestObsIdx){
      clearLayerArr(timeLabels);
      labelItems.length = 0;
      if(currentTimeLabel){ currentTimeLabel.remove(); currentTimeLabel = null; }

      const show = $("toggleLabels")?.checked !== false;
      if(!show) return;

      const segsPx = [];
      for(let i=0; i<points.length-1; i++){
        const a = map.latLngToContainerPoint([points[i].lat, points[i].lon]);
        const b = map.latLngToContainerPoint([points[i+1].lat, points[i+1].lon]);
        segsPx.push([{x:a.x,y:a.y},{x:b.x,y:b.y}]);
      }

      const OFFSETS = [
        {dx: 120, dy:-20},
        {dx: 120, dy: 26},
        {dx: 150, dy:-52},
        {dx: 150, dy: 56},
        {dx: 180, dy: 0},
        {dx: 90, dy:-60},
        {dx: 90, dy: 60},
        {dx:-120, dy:-30},
        {dx:-120, dy: 30}
      ];

      const placedRects = [];

      function makeLabelHtml(timeText, color, isCurrent=false, dx=0, dyTop=0){
        return `
          <div style="transform: translate(${dx}px, ${dyTop}px);">
            <div class="tlabel-wrap">
              <span class="tlabel ${isCurrent ? "current" : ""}" ${isCurrent ? `style="border-color:${color}66;"` : ""}>
                <span class="miniDot" style="background:${color};"></span>
                ${escapeHtml(fmtTime(timeText,"full"))}
              </span>
            </div>
          </div>
        `;
      }

      const measurer = (function(){
        let el = document.getElementById("__label_measurer__");
        if(el) return el;
        el = document.createElement("div");
        el.id = "__label_measurer__";
        el.style.position = "fixed";
        el.style.left = "-9999px";
        el.style.top = "-9999px";
        el.style.pointerEvents = "none";
        el.style.visibility = "hidden";
        document.body.appendChild(el);
        return el;
      })();

      function measureLabel(html){
        measurer.innerHTML = html;
        const node = measurer.querySelector(".tlabel");
        if(!node) return {w:160,h:32};
        const r = node.getBoundingClientRect();
        return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
      }

      function tryPickOffset(anchorPx, size, pad=6){
        for(const o of OFFSETS){
          const dyTop = o.dy - size.h;
          const rect = { x: anchorPx.x + o.dx, y: anchorPx.y + dyTop, w: size.w, h: size.h };
          const rectPad = expandRect(rect, pad);

          let bad = false;
          for(const pr of placedRects){
            if(rectsOverlap(rectPad, pr)){ bad = true; break; }
          }
          if(bad) continue;

          if(rectHitsPolyline(rectPad, segsPx, 10)) continue;

          placedRects.push(rectPad);
          return { dx:o.dx, dyTop };
        }

        const o = OFFSETS[0];
        const dyTop = o.dy - size.h;
        const rect = { x: anchorPx.x + o.dx, y: anchorPx.y + dyTop, w: size.w, h: size.h };
        placedRects.push(expandRect(rect, pad));
        return { dx:o.dx, dyTop };
      }

      function addOneLabel(idx, isCurrent){
        const p = points[idx];
        const st = getStyle(p.level);
        const anchor = map.latLngToContainerPoint([p.lat, p.lon]);

        const tmpHtml = makeLabelHtml(p.time, st.color, isCurrent, 0, 0);
        const size = measureLabel(tmpHtml);

        const picked = tryPickOffset(anchor, size);
        const html = makeLabelHtml(p.time, st.color, isCurrent, picked.dx, picked.dyTop);

        const marker = L.marker([p.lat, p.lon], {
          pane: "labelPane",
          icon: L.divIcon({
            className: "",
            html,
            iconSize: [size.w, size.h],
            iconAnchor: [0, 0]
          }),
          interactive: false
        }).addTo(map);
        timeLabels.push(marker);

        const attachPx = L.point(anchor.x + picked.dx, anchor.y + picked.dyTop + size.h/2);
        const attachLL = map.containerPointToLatLng(attachPx);

        const line = L.polyline([[p.lat, p.lon], [attachLL.lat, attachLL.lng]], {
          pane: "labelPane",
          color: isCurrent ? "rgba(17,24,39,.55)" : "rgba(17,24,39,.38)",
          weight: isCurrent ? 2 : 1.5,
          dashArray: null,
          interactive: false
        }).addTo(map);
        timeLabels.push(line);

        labelItems.push({ idx, dx: picked.dx, dyTop: picked.dyTop, w:size.w, h:size.h, marker, line });
        if(isCurrent) currentTimeLabel = marker;
      }

      let fcstCount = 1;
      const STEP = 3;

      points.forEach((p, idx) => {
        if(p.kind !== "fcst") return;
        const shouldShow = (fcstCount % STEP === 0);
        fcstCount += 1;
        if(!shouldShow) return;
        addOneLabel(idx, false);
      });

      addOneLabel(latestObsIdx, true);
      updateLabelLines();
    }

    function fitAll(){
      if(fullBounds && fullBounds.isValid()){
        map.fitBounds(fullBounds, {
          paddingTopLeft: [30, 30],
          paddingBottomRight: [220, 40]
        });
      }
    }

    function renderForecastList(){
      const list = $("fcstList");
      list.innerHTML = "";
      const fcst = points.map((p, idx) => ({...p, _idx: idx})).filter(p => p.kind === "fcst");
      $("fcstCount").textContent = `${fcst.length} 筆`;

      if(fcst.length === 0){
        const empty = document.createElement("div");
        empty.className = "fcstCard";
        empty.style.width = "100%";
        empty.style.cursor = "default";
        empty.innerHTML = `<div style="font-weight:900;color:#111;">沒有預報資料</div>`;
        list.appendChild(empty);
        return;
      }

      fcst.forEach(p => {
        const st = getStyle(p.level);
        const card = document.createElement("div");
        card.className = "fcstCard";
        card.innerHTML = `
          <div class="fcstRow1">
            <div class="fcstTime">${escapeHtml(fmtTime(p.time,"short"))}</div>
            <span class="fcstBadge" style="border-color:${st.color}33;">
              <span style="width:8px;height:8px;border-radius:999px;background:${st.color};display:inline-block;"></span>
              ${escapeHtml(p.level || "-")}
            </span>
          </div>
          <div class="fcstKv">
            <div class="k">風速</div><div class="v">${escapeHtml(fmtWindMs(p.wind))}</div>
            <div class="k">氣壓</div><div class="v">${p.pressure ? escapeHtml(p.pressure + " hPa") : "—"}</div>
            <div class="k">座標</div><div class="v">${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}</div>
            <div class="k">誤差</div><div class="v">${(typeof p.fcst_radius_km==="number") ? escapeHtml(p.fcst_radius_km+" km") : "—"}</div>
          </div>
        `;
        card.addEventListener("click", () => {
          const idx = p._idx;
          if(pointMarkers[idx]){
            map.setView([p.lat, p.lon], Math.max(map.getZoom(), 6), { animate: true });
            pointMarkers[idx].openPopup();
          }
        });
        list.appendChild(card);
      });
    }

    function enableHorizontalWheelScroll(){
      const el = $("fcstList");
      if(!el) return;
      el.addEventListener("wheel", (e) => {
        if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
          el.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });
    }

    async function init(){
      await loadWeatherData();

      if(typeof L === "undefined"){
        alert("Leaflet 沒載入成功。");
        return;
      }

      if(!points || points.length < 2){
        alert("points 至少需要 2 個點。");
        return;
      }

      map = L.map("map", { zoomControl: true });
      map.setView([points[0].lat, points[0].lon], 5);

      ensurePanes();

      let baseLayerLoaded = false;

      if(MAPBOX_TOKEN !== "YOUR_MAPBOX_TOKEN" && MAPBOX_STYLE !== "YOUR_USERNAME/YOUR_STYLE_ID"){
        const mb = L.tileLayer(
          `https://api.mapbox.com/styles/v1/${MAPBOX_STYLE}/tiles/512/{z}/{x}/{y}?access_token=${MAPBOX_TOKEN}`,
          { tileSize: 512, zoomOffset: -1, maxZoom: 18, attribution: "© Mapbox © OpenStreetMap" }
        );

        mb.on("tileerror", () => {
          if(baseLayerLoaded) return;
          if(map.hasLayer(mb)) map.removeLayer(mb);
          const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "© OpenStreetMap"
          }).addTo(map);
          osm.once("load", () => {
            baseLayerLoaded = true;
            setTimeout(() => map.invalidateSize(), 60);
          });
        });

        mb.addTo(map);
        mb.once("load", () => {
          baseLayerLoaded = true;
          setTimeout(() => map.invalidateSize(), 60);
        });
      } else {
        const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap"
        }).addTo(map);
        osm.once("load", () => {
          baseLayerLoaded = true;
          setTimeout(() => map.invalidateSize(), 60);
        });
      }

      cachedConePoly = null;
      drawForecastCone();
      drawSegments();

      const latestObsIdx = getLatestObsIndex();
      setObsTopInfo(points[latestObsIdx]);
      drawPoints(latestObsIdx);
      drawStormRings();
      drawTimeLabels(latestObsIdx);

      renderForecastList();
      renderWeatherTable();
      enableHorizontalWheelScroll();

      $("toggleLabels").addEventListener("change", () => drawTimeLabels(latestObsIdx));
      $("toggleCone").addEventListener("change", drawForecastCone);
      $("toggleRings").addEventListener("change", drawStormRings);

      map.on("move", scheduleUpdateLabelLines);
      map.on("zoom", scheduleUpdateLabelLines);
      map.on("moveend", scheduleUpdateLabelLines);
      map.on("zoomend", () => {
        const show = $("toggleLabels")?.checked !== false;
        if(show) drawTimeLabels(latestObsIdx);
        drawForecastCone();
        drawStormRings();
      });

      fitAll();
      $("fitAllBtn").addEventListener("click", fitAll);

      function beforePrint(){
        try{ map.invalidateSize(true); }catch(e){}
      }

      window.addEventListener("beforeprint", beforePrint);
      $("printBtn").addEventListener("click", () => {
        beforePrint();
        setTimeout(() => window.print(), 30);
      });

      setTimeout(() => map.invalidateSize(), 250);
    }

    window.addEventListener("load", init);
  </script>
</body>
